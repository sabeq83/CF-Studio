<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&family=Inter:wght@500;700&display=swap">
<style>
:root{--accent:#ffcc3d;--f-punch:"Anton",Impact,sans-serif;--f-sub:"Montserrat","Arial Black",sans-serif;--f-ui:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:transparent}
.phone{position:relative;width:720px;height:1280px;overflow:hidden;container-type:size;background:transparent}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.progress{position:absolute;left:0;top:0;height:.9cqw;background:var(--accent);width:0}
.hook{position:absolute;left:6cqw;right:6cqw;top:33cqh;text-align:center;font-family:var(--f-punch);text-transform:uppercase;line-height:.95;color:#fff;transform-origin:50% 50%}
.hook .l1{display:block;font-size:8.6cqw;-webkit-text-stroke:.5cqw #000;paint-order:stroke fill;text-shadow:0 1.2cqw 2.4cqw rgba(0,0,0,.55)}
.hook .l2{display:inline-block;margin-top:2cqw;font-size:11cqw;background:var(--accent);color:#111;padding:1cqw 3cqw 0;transform:rotate(-2.5deg)}
.sub{position:absolute;left:8cqw;right:8cqw;top:69cqh;text-align:center;font-family:var(--f-sub);font-weight:900;font-size:6.6cqw;line-height:1.15;text-transform:uppercase;color:#fff;-webkit-text-stroke:.55cqw #000;paint-order:stroke fill;text-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.6)}
.sub span{display:inline-block;margin:0 .6cqw}
.sub span.on{color:var(--accent);transform:scale(1.08)}
.punch{position:absolute;left:4cqw;right:4cqw;top:40cqh;text-align:center;font-family:var(--f-punch);text-transform:uppercase;font-size:16cqw;line-height:.92;transform-origin:50% 50%;-webkit-text-stroke:.6cqw #000;paint-order:stroke fill;text-shadow:0 1.4cqw 0 rgba(0,0,0,.45)}
.prod{position:absolute;left:5cqw;top:28cqh;display:flex;align-items:center;gap:2.6cqw;background:#fff;color:#111;border-radius:3cqw;padding:2cqw 3.6cqw 2cqw 2cqw;box-shadow:0 2cqw 5cqw rgba(0,0,0,.4);max-width:80cqw}
.prod img{width:17cqw;height:17cqw;object-fit:contain;border-radius:2cqw;background:#fff}
.prod .pn{font-family:var(--f-sub);font-weight:900;font-size:4.2cqw;line-height:1.05}
.prod .pd{font-family:var(--f-ui);font-size:2.6cqw;color:#555;margin-top:.8cqw}
.prod .tag{display:inline-block;font-family:var(--f-ui);font-weight:700;font-size:2.4cqw;background:var(--accent);color:#111;border-radius:1cqw;padding:.3cqw 1.4cqw;margin-bottom:.8cqw}
.cta{position:absolute;left:0;right:0;top:47cqh;display:flex;flex-direction:column-reverse;align-items:center;gap:1.5cqw}
.cta .arrow{font-family:var(--f-punch);font-size:12cqw;color:var(--accent);-webkit-text-stroke:.5cqw #000;paint-order:stroke fill;line-height:1}
.cta .pill{font-family:var(--f-sub);font-weight:900;font-size:5.4cqw;text-transform:uppercase;background:var(--accent);color:#111;padding:1.6cqw 4.4cqw;border-radius:99cqw;box-shadow:0 1.4cqw 0 #000}
.ing{position:absolute;left:4.5cqw;top:12cqh;display:grid;gap:1.6cqw;justify-items:start}
.ing .hd{font-family:var(--f-sub);font-weight:900;font-size:3cqw;letter-spacing:.12em;color:#fff;background:rgba(20,12,8,.72);padding:.8cqw 2.2cqw;border-radius:1.2cqw}
.ing .it{display:flex;align-items:center;gap:1.8cqw;background:#fff8ee;color:#2a1a10;font-family:var(--f-sub);font-weight:800;font-size:4.2cqw;padding:1.4cqw 3cqw 1.4cqw 1.6cqw;border-radius:99cqw;box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.35)}
.ing .it .ck{width:5.2cqw;height:5.2cqw;border-radius:50%;background:#5a3420;color:#fff;display:grid;place-items:center;font-size:3.2cqw;font-family:var(--f-ui);font-weight:700}
.ing .it.new{background:var(--accent);color:#1d120a}
.step{position:absolute;right:4.5cqw;top:12cqh;text-align:right;font-family:var(--f-sub);font-weight:900;color:#fff;transform-origin:100% 0}
.step .n{display:inline-block;background:#2a1a10;border:.5cqw solid #fff;border-radius:2cqw;padding:.8cqw 2.4cqw;font-size:4cqw;letter-spacing:.06em}
.step .t{display:block;margin-top:1.2cqw;font-size:3.3cqw;-webkit-text-stroke:.4cqw #000;paint-order:stroke fill;text-transform:uppercase}
.save{position:absolute;left:0;right:0;top:56cqh;display:flex;justify-content:center}
.save span{background:rgba(255,255,255,.94);color:#111;font-family:var(--f-sub);font-weight:800;font-size:4.2cqw;padding:1.6cqw 4cqw;border-radius:99cqw;box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.35)}
</style></head>
<body>
<div class="phone" id="phone">
  <div class="flash" id="oFlash"></div>
  <div class="ing" id="oIng" hidden></div>
  <div class="step" id="oStep" hidden><span class="n"></span><span class="t"></span></div>
  <div class="prod" id="oProd" hidden><img src="cocoa.jpg" alt=""><div><span class="tag">BAHAN KUNCI</span><div class="pn">Premix Cocoa<br>Powder Premium</div><div class="pd">Tanpa gula · 100 gram</div></div></div>
  <div class="hook" id="oHook" hidden><span class="l1">Brownies tanpa gula</span><span class="l2">cuma 3 bahan</span></div>
  <div class="save" id="oSave" hidden><span>📌 Simpan dulu, resep lengkap di caption</span></div>
  <div class="punch" id="oPunch" hidden></div>
  <div class="cta" id="oCta" hidden><div class="arrow">▼</div><div class="pill">Cek keranjang kuning</div></div>
  <div class="sub" id="oSub"></div>
  <div class="progress" id="oProg"></div>
</div>
<script>
const cum = a => a.reduce((o,d)=>{o.push(+(o[o.length-1]+d).toFixed(3));return o;},[0]);
const P = {
  dur: 21.01, clips: cum([2.212,2.595,3.396,2.549,6.231,4.0]),
  segs: [
    {c:0,s:.194,e:1.678,text:'Punya banyak pisang matang di rumah?'},
    {c:1,s:.162,e:2.063,text:'Campur dengan telur ayam segar pilihan.'},
    {c:2,s:.166,e:1.408,text:'Tambahkan bubuk kakao'},
    {c:2,s:1.498,e:2.875,text:'berkualitas untuk adonannya.'},
    {c:3,s:.162,e:2.066,text:'Cukup aduk sampai rata semua bahan.'},
    {c:4,s:.167,e:2.656,text:'Kuncinya pakai Premix Cocoa Powder Premium.'},
    {c:4,s:4.068,e:5.690,text:'Tanpa tambahan gula sama sekali.'},
    {c:5,s:.115,e:1.022,text:'Hasilnya fudgy,'},
    {c:5,s:1.195,e:3.516,text:'wangi, dan produk ori ada di keranjang ya!'}
  ],
  hook: {s:0, e:2.15},
  punches: [['tanpa tambahan gula','benefit'],['fudgy','result']],
  ingredients: {until:10.65, items:[{word:'pisang',label:'2 pisang matang'},{word:'telur',label:'1 butir telur'},{word:'kakao',label:'3 sdm cocoa powder'}]},
  steps: ['Lumatkan','Masukkan telur','Ayak cocoa','Aduk rata','Tuang & panggang',null],
  save: {s:8.45, e:10.6},
  prod: {word:'premix', end:16.95},
  cta: {word:'produk'}
};
const PCOL = {benefit:'#9df27a', result:'#ffcc3d'};
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const W = [];
P.segs.forEach(sg => { const ws = sg.text.split(/\s+/), wt = ws.map(w => norm(w).length + 1.6), tot = wt.reduce((a,b)=>a+b,0);
  let t = P.clips[sg.c] + sg.s; const span = sg.e - sg.s; ws.forEach((w,i) => { const d = span*wt[i]/tot; W.push({w, s:t, e:t+d, c:sg.c}); t += d; }); });
const find = ph => { const q = ph.split(' ').map(norm); for (let i=0;i<W.length;i++) if (q.every((x,k)=>W[i+k] && norm(W[i+k].w)===x)) return i; return -1; };
const CH = []; let cur = [];
W.forEach((x,i) => { cur.push(i); const len = cur.map(j=>W[j].w).join(' ').length;
  if (/[,.?!]$/.test(x.w) || cur.length>=4 || (cur.length>=2 && len>15) || (W[i+1] && W[i+1].c!==x.c)) { CH.push(cur); cur=[]; } });
if (cur.length) CH.push(cur);
const PUNCH = P.punches.map(([ph,type]) => { const i = find(ph), n = ph.split(' ').length;
  return {text:ph.toUpperCase()+(type==='result'?'!':''), type, s:W[i].s-.04, e:Math.max(W[i+n-1].e+.35, W[i].s+1.0), wi:i, n}; });
const PW = new Set(); PUNCH.forEach(x => { for (let k=0;k<x.n;k++) PW.add(x.wi+k); });
const PROD = {s:W[find(P.prod.word)].s+.1, e:P.prod.end};
const CTA = {s:W[find(P.cta.word)].s-.05, e:P.dur};
const ING = P.ingredients.items.map(it => ({...it, s:W[find(it.word)].s}));
const STEPS = P.steps.map((t,i)=> t ? {s:P.clips[i]+.05, e:P.clips[i+1]-.02, n:i+1, total:5, t} : null).filter(Boolean);
const SFX = [...PUNCH.map(x=>({t:x.s,k:'pop'})), ...P.clips.slice(1,-1).map(t=>({t,k:'whoosh'})), {t:.02,k:'whoosh'}, {t:PROD.s,k:'pop'}, ...ING.map(x=>({t:x.s,k:'tick'}))];
window.META = {clips:P.clips, punches:PUNCH.map(p=>p.s), sfx:SFX, dur:P.dur};

const $ = id => document.getElementById(id);
const oHook=$('oHook'), oSub=$('oSub'), oPunch=$('oPunch'), oProd=$('oProd'), oCta=$('oCta'), oProg=$('oProg'), oFlash=$('oFlash'), oIng=$('oIng'), oStep=$('oStep'), oSave=$('oSave');
const backOut = x => { const c=1.9; x=Math.min(Math.max(x,0),1); return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const easeOut = x => 1 - Math.pow(1-Math.min(Math.max(x,0),1),3);
function popAnim(el, t, s, e, inDur=.2, outDur=.14, rot=0){ const lt = t - s, rt = e - t; let sc = backOut(lt/inDur), op = Math.min(1, lt/.06);
  if (rt < outDur){ const k = Math.max(rt,0)/outDur; op = Math.min(op, k); sc *= .9 + .1*k; } el.style.opacity = op; el.style.transform = `scale(${sc}) rotate(${rot}deg)`; }
const inR = (t,a) => t >= a.s && t < a.e;
window.renderAt = function(t){
  const hookOn = inR(t,P.hook); oHook.hidden = !hookOn; if (hookOn) popAnim(oHook, t, P.hook.s, P.hook.e, .28, .18);
  const p = PUNCH.find(x => inR(t,x)); oPunch.hidden = !p;
  if (p){ oPunch.textContent = p.text; oPunch.style.color = PCOL[p.type]; popAnim(oPunch, t, p.s, p.e, .2, .15, 2); }
  let html = '';
  if (!p){ const ch = CH.find(c => t >= W[c[0]].s - .05 && t < W[c[c.length-1]].e + .12);
    if (ch) html = ch.filter(i => !PW.has(i)).map(i => `<span class="${t>=W[i].s && t<W[i].e+.05 ? 'on':''}">${W[i].w}</span>`).join(' '); }
  oSub.innerHTML = html;
  const ingOn = t >= ING[0].s && t < P.ingredients.until; oIng.hidden = !ingOn;
  if (ingOn){ const shown = ING.filter(x => t >= x.s);
    oIng.innerHTML = `<div class="hd">BAHAN ${shown.length}/${ING.length}</div>` + shown.map((x,i) => `<div class="it${i===shown.length-1 && t-x.s<.6?' new':''}"><span class="ck">✓</span>${x.label}</div>`).join('');
    [...oIng.querySelectorAll('.it')].forEach((el,i) => { const lt = t - ING[i].s; el.style.transform = `translateX(${(1-easeOut(lt/.3))*-60}cqw)`; });
    oIng.style.opacity = Math.min(1, (P.ingredients.until - t)/.25); }
  const st = STEPS.find(x => inR(t,x)); oStep.hidden = !st;
  if (st){ oStep.querySelector('.n').textContent = `LANGKAH ${st.n}/${st.total}`; oStep.querySelector('.t').textContent = st.t; popAnim(oStep, t, st.s, st.e, .22, .1); }
  const sv = inR(t,P.save) && !p; oSave.hidden = !sv; if (sv) popAnim(oSave, t, P.save.s, P.save.e, .25, .2);
  const pr = inR(t,PROD); oProd.hidden = !pr;
  if (pr){ oProd.style.transform = `translateX(${(1-easeOut((t-PROD.s)/.35))*-110}cqw)`; oProd.style.opacity = Math.min(1, (PROD.e-t)/.2); }
  const ca = inR(t,CTA); oCta.hidden = !ca;
  if (ca){ popAnim(oCta, t, CTA.s, CTA.e+1, .25); oCta.querySelector('.arrow').style.transform = `translateY(${Math.abs(Math.sin((t-CTA.s)*6))*3}cqw)`; }
  let fl = 0; P.clips.slice(1,-1).forEach(c => { const d=t-c; if (d>=0 && d<.12) fl = .55*(1-d/.12); }); oFlash.style.opacity = fl;
  oProg.style.width = (t/P.dur*100)+'%';
};
</script>
</body></html>
