<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: var(--fx-accent);
      --accent-soft: var(--fx-accent);
      --active-word: var(--fx-accent);
      --f-punch: var(--fx-font-display);
      --f-sub: var(--fx-font-body);
      --f-ui: var(--fx-font-ui);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: var(--fx-card-ink);
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--fx-accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 19cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      line-height: 0.95;
      color: var(--fx-card-ink);
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, var(--fx-size-display-sm));
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.55);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 2cqw;
      font-size: var(--hook-l2-size, var(--fx-size-display));
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1cqw 3cqw 0.25cqw;
      transform: rotate(-2.5deg);
      border-radius: var(--fx-radius);
      box-shadow: 0 1.1cqw 2.4cqw rgba(0, 0, 0, 0.4);
    }
    .ing {
      position: absolute;
      left: 4.5cqw;
      top: 12cqh;
      max-width: 52cqw;
      display: grid;
      gap: 1cqw;
      justify-items: start;
      z-index: 6;
    }
    .ing .hd {
      font-family: var(--fx-font-ui);
      font-weight: 700;
      font-size: var(--fx-size-label);
      letter-spacing: 0.05em;
      color: var(--fx-card-ink);
      background: var(--fx-card);
      padding: 0.6cqw 1.8cqw;
      border-radius: var(--fx-radius);
      text-transform: var(--fx-text-case);
    }
    .ing .it {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
      background: var(--fx-chip);
      color: var(--fx-chip-ink);
      font-family: var(--fx-font-body);
      font-weight: 600;
      font-size: var(--fx-size-body);
      padding: 0.85cqw 1.8cqw 0.85cqw 1.1cqw;
      border-radius: var(--fx-radius);
      box-shadow: var(--fx-shadow);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: none;
    }
    .ing .it .ck {
      width: 3.8cqw;
      height: 3.8cqw;
      border-radius: 50%;
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      display: grid;
      place-items: center;
      font-size: 2.2cqw;
      font-family: var(--fx-font-ui);
      font-weight: 700;
      flex-shrink: 0;
    }
    .ing .it.new {
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
    }
    .ing .more {
      display: inline-block;
      font-family: var(--fx-font-ui);
      font-weight: 700;
      font-size: var(--fx-size-meta);
      color: var(--fx-card-ink);
      background: var(--fx-card);
      padding: 0.6cqw 1.8cqw;
      border-radius: var(--fx-radius);
    }
    .step {
      position: absolute;
      right: 15cqw;
      top: 12cqh;
      max-width: 38cqw;
      text-align: right;
      font-family: var(--fx-font-body);
      font-weight: 800;
      color: var(--fx-card-ink);
      transform-origin: 100% 0;
      z-index: 6;
    }
    .step .n {
      display: inline-block;
      background: var(--fx-card);
      color: var(--fx-card-ink);
      border: 0.35cqw solid var(--fx-accent);
      border-radius: var(--fx-radius);
      padding: 0.6cqw 1.8cqw;
      font-size: var(--fx-size-label);
      letter-spacing: 0.05em;
      font-family: var(--fx-font-ui);
    }
    .step .t {
      display: block;
      margin-top: 0.8cqw;
      font-size: var(--fx-size-body);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-transform: var(--fx-text-case);
    }
    .prod {
      position: absolute;
      left: 5cqw;
      top: 14cqh;
      max-width: 78cqw;
      display: flex;
      align-items: center;
      gap: 2.4cqw;
      background: var(--fx-card);
      color: var(--fx-card-ink);
      border-radius: var(--fx-radius);
      padding: 1.6cqw 2.8cqw 1.6cqw 1.8cqw;
      box-shadow: var(--fx-shadow);
      z-index: 6;
    }
    .prod img {
      width: 14cqw;
      height: 14cqw;
      object-fit: contain;
      border-radius: 1.6cqw;
      background: var(--fx-chip);
      flex-shrink: 0;
    }
    .prod .tag {
      display: inline-block;
      font-family: var(--fx-font-ui);
      font-weight: 700;
      font-size: var(--fx-size-label);
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      border-radius: 1cqw;
      padding: 0.3cqw 1.2cqw;
      margin-bottom: 0.6cqw;
    }
    .prod .pn {
      font-family: var(--fx-font-body);
      font-weight: 800;
      font-size: var(--fx-size-body);
      line-height: 1.1;
    }
    .prod .pd {
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-meta);
      color: var(--fx-card-muted);
      margin-top: 0.5cqw;
    }
    .prod .disc {
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-meta);
      color: var(--fx-card-muted);
      margin-top: 0.4cqw;
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 44cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      font-size: var(--punch-size, var(--fx-size-display));
      line-height: 0.92;
      transform-origin: 50% 50%;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.45);
    }
    .save {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 14cqh;
      display: flex;
      justify-content: center;
      z-index: 6;
    }
    .save .card {
      background: var(--fx-card);
      color: var(--fx-card-ink);
      border-radius: var(--fx-radius);
      padding: 1.4cqw 3.6cqw;
      text-align: center;
      box-shadow: var(--fx-shadow);
    }
    .save .stitle {
      font-family: var(--fx-font-body);
      font-weight: 800;
      font-size: var(--fx-size-body);
    }
    .save .ssub {
      font-family: var(--fx-font-ui);
      font-weight: 600;
      font-size: var(--fx-size-meta);
      color: var(--fx-card-muted);
      margin-top: 0.25cqw;
    }
    .cta {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 47cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.4cqw;
    }
    .cta .arrow {
      font-family: var(--fx-font-display);
      font-size: 11cqw;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--fx-font-body);
      font-weight: 900;
      font-size: var(--fx-size-body);
      text-transform: var(--fx-text-case);
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1.4cqw 3.8cqw;
      border-radius: var(--fx-radius);
      box-shadow: 0 1.2cqw 0 var(--fx-stroke);
    }
  </style>
  <script src="./shared-layers.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="flash" id="oFlash"></div>
    <div class="ing" id="oIng" hidden></div>
    <div class="step" id="oStep" hidden><span class="n" id="oStepNum"></span><span class="t" id="oStepTxt"></span></div>
    <div class="prod" id="oProd" hidden>
      <img id="oProdImg" alt="" hidden>
      <div>
        <span class="tag" id="oProdTag">BAHAN UTAMA</span>
        <div class="pn" id="oProdName"></div>
        <div class="pd" id="oProdDesc" hidden></div>
        <div class="disc" id="oProdDisc" hidden></div>
      </div>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="save" id="oSave" hidden>
      <div class="card">
        <div class="stitle" id="oSaveTitle"></div>
        <div class="ssub" id="oSaveSub" hidden></div>
      </div>
    </div>
    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow"></div>
      <div class="pill" id="oCtaPill"></div>
    </div>
    <div class="sub" id="oSub" hidden></div>
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="layer" id="oPatch" hidden></div>
    <div class="layer" id="oBrand" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const SL = window.FinishingSharedLayers || null;
      let T = null;
      let labels = { ingredientsHeader: 'BAHAN', stepLabel: 'LANGKAH' };

      const oFlash = document.getElementById('oFlash');
      const oProg = document.getElementById('oProg');
      const oIng = document.getElementById('oIng');
      const oStep = document.getElementById('oStep');
      const oStepNum = document.getElementById('oStepNum');
      const oStepTxt = document.getElementById('oStepTxt');
      const oProd = document.getElementById('oProd');
      const oProdImg = document.getElementById('oProdImg');
      const oProdTag = document.getElementById('oProdTag');
      const oProdName = document.getElementById('oProdName');
      const oProdDesc = document.getElementById('oProdDesc');
      const oProdDisc = document.getElementById('oProdDisc');
      const oPunch = document.getElementById('oPunch');
      const oSave = document.getElementById('oSave');
      const oSaveTitle = document.getElementById('oSaveTitle');
      const oSaveSub = document.getElementById('oSaveSub');
      const oCta = document.getElementById('oCta');
      const oCtaArrow = document.getElementById('oCtaArrow');
      const oCtaPill = document.getElementById('oCtaPill');
      const oSub = document.getElementById('oSub');
      const oHook = document.getElementById('oHook');
      const oHookL1 = document.getElementById('oHookL1');
      const oHookL2 = document.getElementById('oHookL2');
      const oPatch = document.getElementById('oPatch');
      const oBrand = document.getElementById('oBrand');
      const dynamicFonts = document.getElementById('dynamic-fonts');
      const sharedLayersCss = document.getElementById('shared-layers-css');

      if (SL && sharedLayersCss) {
        sharedLayersCss.textContent = SL.SHARED_LAYERS_CSS;
      }

      const PUNCH_COLORS = {
        problem: 'var(--fx-phase-problem)',
        benefit: 'var(--fx-accent)',
        result: 'var(--fx-phase-solution)',
        hook: 'var(--fx-accent)'
      };

      function easeOut(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function applyPop(el, time, s, e, inDur = 0.22, outDur = 0.16, rotDeg = 0) {
        const dt = time - s;
        const rem = e - time;
        if (dt < 0 || rem < 0) {
          el.style.opacity = '0';
          el.style.transform = `scale(0.85) rotate(${rotDeg}deg)`;
          return;
        }
        if (dt < inDur) {
          const k = Math.min(1, Math.max(0, dt / inDur));
          const sc = 0.85 + 0.15 * easeOutBack(k);
          el.style.opacity = String(k);
          el.style.transform = `scale(${sc.toFixed(4)}) rotate(${(rotDeg * k).toFixed(2)}deg)`;
        } else if (rem < outDur) {
          const k = Math.min(1, Math.max(0, rem / outDur));
          el.style.opacity = String(k);
          el.style.transform = `scale(${(0.9 + 0.1 * k).toFixed(4)}) rotate(${(rotDeg * k).toFixed(2)}deg)`;
        } else {
          el.style.opacity = '1';
          el.style.transform = `scale(1) rotate(${rotDeg}deg)`;
        }
      }

      window.loadTimeline = function (timeline) {
        T = timeline;
        const cfg = T.config || {};

        if (SL?.applySkinTokens) {
          SL.applySkinTokens(document, T.skin);
        } else if (T.skin?.tokens) {
          for (const [k, v] of Object.entries(T.skin.tokens)) {
            document.documentElement.style.setProperty(k, v);
          }
        }

        labels = SL ? SL.getLocalizedLabels(cfg.targetLanguage || T.brand?.targetLanguage || 'id-ID') : { ingredientsHeader: 'BAHAN', stepLabel: 'LANGKAH' };

        const customAccent = cfg.accentColor || cfg.accent || (T.brand && (T.brand.accentColor || T.brand.accent));
        if (customAccent) {
          document.documentElement.style.setProperty('--fx-accent', customAccent);
          document.documentElement.style.setProperty('--accent', customAccent);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }

        if (SL?.buildDynamicFontFaces && cfg.fontBaseUrl) {
          dynamicFonts.textContent = SL.buildDynamicFontFaces(cfg.fontBaseUrl);
        }

        const pos = cfg.position || 'bottom';
        let subTop = '69cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        oSub.dataset.subTop = subTop;
        if (SL?.configureSubtitleLayer) {
          SL.configureSubtitleLayer(oSub, cfg, { subTop, subRight: '15cqw' });
        } else {
          document.documentElement.style.setProperty('--sub-top', subTop);
        }

        const hc = T.hookCard;
        if (hc && hc.l1) {
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.086) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.11) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const pr = T.productCard;
        if (pr && pr.name) {
          oProdName.textContent = pr.name;
          if (pr.specLine) {
            oProdDesc.textContent = pr.specLine;
            oProdDesc.hidden = false;
          }
          if (pr.tag) oProdTag.textContent = pr.tag;
          if (pr.disclaimer) {
            oProdDisc.textContent = pr.disclaimer;
            oProdDisc.hidden = false;
          }
          if (pr.imageUrl) {
            oProdImg.src = pr.imageUrl;
            oProdImg.hidden = false;
          }
        }

        const sv = T.savePrompt;
        if (sv && sv.titleText) {
          oSaveTitle.textContent = sv.titleText;
          if (sv.subtitleText) {
            oSaveSub.textContent = sv.subtitleText;
            oSaveSub.hidden = false;
          }
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.55 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null };
        const endOn = Boolean(brandState.endCard);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(!endOn && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        // Slot resolver helper (Aturan Satu Fokus)
        const slot = (layer) => (T.slots || []).find((x) => x.layer === layer && time >= x.s && time < x.e);

        // Keyword Punch
        const punchSlot = slot('punch');
        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = punchSlot ? punchSlot.ref : (!endOn ? punches.find((p) => time >= p.s && time < p.e) : null);
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = 'var(--fx-size-display)';
          if (cLen > 24) pSize = '11cqw';
          else if (cLen > 18) pSize = '12.6cqw';
          else if (cLen > 13) pSize = '14cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || PUNCH_COLORS.result;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 2);
        }

        // Ingredients (Aturan Satu Fokus: Jendela 3 chip, maks 4 detik)
        const ing = T.recipe?.ingredients;
        const ingItems = Array.isArray(ing?.items) ? ing.items : [];
        const ingSlot = slot('ingredients');
        const showIng = Boolean(ingSlot ? ingSlot.ref : (!endOn && ingItems.length > 0 && !showHook && time >= ingItems[0].s && time < Number(ing.until || 0)));
        oIng.hidden = !showIng;
        if (showIng) {
          const shownTotal = ingItems.filter((x) => time >= x.s).length;
          const activeWindowChips = ingItems.filter((x) => time >= x.s && (x.e ? time < x.e : true)).slice(0, 3);
          const totalDisplay = Number(ing.totalCount || ingItems.length);
          const hd = document.createElement('div');
          hd.className = 'hd';
          hd.textContent = `${labels.ingredientsHeader || 'BAHAN'} ${shownTotal}/${totalDisplay}`;
          const chipsHtml = activeWindowChips.map((x, idx) => {
            const isNew = idx === activeWindowChips.length - 1 && (time - x.s) < 0.55;
            const slideX = ((1 - easeOut((time - x.s) / 0.3)) * -60).toFixed(2);
            const row = document.createElement('div');
            row.className = `it${isNew ? ' new' : ''}`;
            row.style.transform = `translateX(${slideX}cqw)`;
            const ck = document.createElement('span');
            ck.className = 'ck';
            ck.textContent = '✓';
            const lb = document.createElement('span');
            lb.textContent = x.label;
            row.appendChild(ck);
            row.appendChild(lb);
            return row.outerHTML;
          }).join('');
          oIng.innerHTML = hd.outerHTML + chipsHtml;
          oIng.style.opacity = String(Math.min(1, Math.max(0, (Number(ing.until) - time) / 0.25)));
        }

        // StepBadge (Langkah mulai setelah bahan)
        const steps = Array.isArray(T.recipe?.steps) ? T.recipe.steps : [];
        const stepSlot = slot('step');
        const activeStep = stepSlot ? stepSlot.ref : (!endOn && !activePunch && !showHook
          ? steps.find((st) => time >= st.s && time < st.e)
          : null);
        oStep.hidden = !activeStep;
        if (activeStep) {
          oStepNum.textContent = activeStep.badge || `${labels.stepLabel || 'LANGKAH'} ${activeStep.n}/${activeStep.total}`;
          oStepTxt.textContent = activeStep.t || '';
          applyPop(oStep, time, activeStep.s, activeStep.e, 0.22, 0.1, 0);
        }

        // Product Card
        const pr = T.productCard;
        const prodSlot = slot('product');
        const showProd = Boolean(prodSlot ? prodSlot.ref : (!endOn && pr && pr.name && !activePunch && !showHook && time >= pr.s && time < pr.e));
        oProd.hidden = !showProd;
        if (showProd) {
          const slideX = (1 - easeOut((time - pr.s) / 0.35)) * -105;
          const fadeOut = Math.min(1, Math.max(0, (pr.e - time) / 0.2));
          oProd.style.transform = `translateX(${slideX.toFixed(2)}cqw)`;
          oProd.style.opacity = String(fadeOut);
        }

        // Save Prompt
        const sv = T.savePrompt;
        const saveSlot = slot('save');
        const showSave = Boolean(saveSlot ? saveSlot.ref : (!endOn && sv && sv.titleText && !activePunch && time >= sv.s && time < sv.e));
        oSave.hidden = !showSave;
        if (showSave) {
          applyPop(oSave, time, sv.s, sv.e, 0.24, 0.18, 0);
        }

        // CTA
        const ca = T.cta;
        const ctaSlot = slot('cta');
        const showCta = Boolean(ctaSlot ? ctaSlot.ref : (!endOn && ca && ca.text && !activePunch && !showSave && time >= ca.s && time <= ca.e));
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.8;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        // Subtitle
        if (SL?.renderSubtitle) {
          SL.renderSubtitle(oSub, T, time, {
            captionMode,
            activePunch,
            hidden: endOn,
            subTop: oSub.dataset.subTop || '69cqh',
            subRight: '15cqw'
          });
        }
      };
    })();
  </script>
</body>
</html>
