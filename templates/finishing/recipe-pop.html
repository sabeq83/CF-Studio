<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style>
    :root {
      --accent: #ffcc3d;
      --accent-soft: #e2b857;
      --active-word: #fff066;
      --f-punch: "Anton", Impact, sans-serif;
      --f-sub: "Montserrat", "Arial Black", sans-serif;
      --f-ui: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 19cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      line-height: 0.95;
      color: #ffffff;
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, 8.6cqw);
      -webkit-text-stroke: 0.5cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.55);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 2cqw;
      font-size: var(--hook-l2-size, 11cqw);
      background: var(--accent);
      color: #111111;
      padding: 1cqw 3cqw 0.25cqw;
      transform: rotate(-2.5deg);
      box-shadow: 0 1.1cqw 2.4cqw rgba(0, 0, 0, 0.4);
    }
    .ing {
      position: absolute;
      left: 4.5cqw;
      top: 12cqh;
      max-width: 44cqw;
      display: grid;
      gap: 1.4cqw;
      justify-items: start;
    }
    .ing .hd {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 2.9cqw;
      letter-spacing: 0.1em;
      color: #ffffff;
      background: rgba(20, 12, 8, 0.76);
      padding: 0.75cqw 2cqw;
      border-radius: 1.2cqw;
    }
    .ing .it {
      display: flex;
      align-items: center;
      gap: 1.4cqw;
      background: #fff8ee;
      color: #2a1a10;
      font-family: var(--f-sub);
      font-weight: 800;
      font-size: 3.3cqw;
      padding: 1.05cqw 2.1cqw 1.05cqw 1.2cqw;
      border-radius: 99cqw;
      box-shadow: 0 1cqw 2.6cqw rgba(0, 0, 0, 0.35);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ing .it .ck {
      width: 4.6cqw;
      height: 4.6cqw;
      border-radius: 50%;
      background: var(--accent-soft);
      color: #1d120a;
      display: grid;
      place-items: center;
      font-size: 2.8cqw;
      font-family: var(--f-ui);
      font-weight: 700;
      flex-shrink: 0;
    }
    .ing .it.new {
      background: var(--accent);
      color: #1d120a;
    }
    .ing .more {
      display: inline-block;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 2.8cqw;
      color: #ffffff;
      background: rgba(20, 12, 8, 0.8);
      padding: 0.65cqw 2cqw;
      border-radius: 99cqw;
    }
    .step {
      position: absolute;
      right: 15cqw;
      top: 12cqh;
      max-width: 34cqw;
      text-align: right;
      font-family: var(--f-sub);
      font-weight: 900;
      color: #ffffff;
      transform-origin: 100% 0;
    }
    .step .n {
      display: inline-block;
      background: #2a1a10;
      border: 0.45cqw solid #ffffff;
      border-radius: 2cqw;
      padding: 0.7cqw 2cqw;
      font-size: 3.5cqw;
      letter-spacing: 0.05em;
    }
    .step .t {
      display: block;
      margin-top: 1cqw;
      font-size: 3.1cqw;
      -webkit-text-stroke: 0.38cqw #000000;
      paint-order: stroke fill;
      text-transform: uppercase;
    }
    .prod {
      position: absolute;
      left: 5cqw;
      top: 28cqh;
      max-width: 78cqw;
      display: flex;
      align-items: center;
      gap: 2.4cqw;
      background: #ffffff;
      color: #111111;
      border-radius: 3cqw;
      padding: 1.9cqw 3.2cqw 1.9cqw 2cqw;
      box-shadow: 0 1.8cqw 4.6cqw rgba(0, 0, 0, 0.4);
    }
    .prod img {
      width: 15cqw;
      height: 15cqw;
      object-fit: contain;
      border-radius: 2cqw;
      background: #ffffff;
      flex-shrink: 0;
    }
    .prod .tag {
      display: inline-block;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 2.3cqw;
      background: var(--accent);
      color: #111111;
      border-radius: 1cqw;
      padding: 0.3cqw 1.3cqw;
      margin-bottom: 0.7cqw;
    }
    .prod .pn {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 4cqw;
      line-height: 1.05;
    }
    .prod .pd {
      font-family: var(--f-ui);
      font-size: 2.5cqw;
      color: #555555;
      margin-top: 0.6cqw;
    }
    .prod .disc {
      font-family: var(--f-ui);
      font-size: 2cqw;
      color: #6b7280;
      margin-top: 0.4cqw;
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 44cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      font-size: var(--punch-size, 15.5cqw);
      line-height: 0.92;
      transform-origin: 50% 50%;
      -webkit-text-stroke: 0.62cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.45);
    }
    .save {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 56cqh;
      display: flex;
      justify-content: center;
    }
    .save .card {
      background: rgba(255, 255, 255, 0.94);
      color: #111111;
      border-radius: 99cqw;
      padding: 1.4cqw 3.8cqw;
      text-align: center;
      box-shadow: 0 1.2cqw 3cqw rgba(0, 0, 0, 0.35);
    }
    .save .stitle {
      font-family: var(--f-sub);
      font-weight: 800;
      font-size: 3.7cqw;
    }
    .save .ssub {
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 2.4cqw;
      color: #4b5563;
      margin-top: 0.25cqw;
    }
    .cta {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 47cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.4cqw;
    }
    .cta .arrow {
      font-family: var(--f-punch);
      font-size: 11.5cqw;
      color: var(--accent);
      -webkit-text-stroke: 0.48cqw #000000;
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 5cqw;
      text-transform: uppercase;
      background: var(--accent);
      color: #111111;
      padding: 1.5cqw 4.2cqw;
      border-radius: 99cqw;
      box-shadow: 0 1.3cqw 0 #000000;
    }
    .sub {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: var(--sub-top, 69cqh);
      transform: translateY(-50%);
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: nowrap;
      gap: 1.9cqw;
      text-align: center;
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: var(--sub-size, 6.4cqw);
      line-height: 1.15;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      -webkit-text-stroke: 0.55cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 0.6cqw 1.5cqw rgba(0, 0, 0, 0.65);
    }
    .sub span { display: inline-block; margin: 0; }
    .sub span.on { color: var(--active-word); transform: scale(1.07); }
    .sub.pill-mode span {
      background: #ffffff;
      color: #0d0e11;
      -webkit-text-stroke: 0;
      text-shadow: none;
      padding: 0.8cqw 2cqw;
      border-radius: 1.4cqw;
      font-size: 0.85em;
      box-shadow: 0 0.8cqw 2cqw rgba(0, 0, 0, 0.45);
    }
    .sub.pill-mode span.on {
      background: var(--active-word);
      color: #0d0e11;
      transform: scale(1.05);
    }
  </style>
  <script src="./shared-layers.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="flash" id="oFlash"></div>
    <div class="ing" id="oIng" hidden></div>
    <div class="step" id="oStep" hidden><span class="n" id="oStepNum"></span><span class="t" id="oStepTxt"></span></div>
    <div class="prod" id="oProd" hidden>
      <img id="oProdImg" alt="" hidden>
      <div>
        <span class="tag" id="oProdTag"></span>
        <div class="pn" id="oProdName"></div>
        <div class="pd" id="oProdSpec" hidden></div>
        <div class="disc" id="oProdDisc" hidden></div>
      </div>
    </div>
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="save" id="oSave" hidden>
      <div class="card">
        <div class="stitle" id="oSaveTitle"></div>
        <div class="ssub" id="oSaveSub"></div>
      </div>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow"></div>
      <div class="pill" id="oCtaPill"></div>
    </div>
    <div class="sub" id="oSub" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oFlash = $('oFlash');
      const oIng = $('oIng');
      const oStep = $('oStep');
      const oStepNum = $('oStepNum');
      const oStepTxt = $('oStepTxt');
      const oProd = $('oProd');
      const oProdImg = $('oProdImg');
      const oProdTag = $('oProdTag');
      const oProdName = $('oProdName');
      const oProdSpec = $('oProdSpec');
      const oProdDisc = $('oProdDisc');
      const oHook = $('oHook');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oSave = $('oSave');
      const oSaveTitle = $('oSaveTitle');
      const oSaveSub = $('oSaveSub');
      const oPunch = $('oPunch');
      const oCta = $('oCta');
      const oCtaArrow = $('oCtaArrow');
      const oCtaPill = $('oCtaPill');
      const oSub = $('oSub');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');
      const SL = window.FinishingSharedLayers || null;
      let labels = SL ? SL.getLocalizedLabels('id-ID') : { ingredientsHeader: 'BAHAN', stepLabel: 'LANGKAH' };

      const PUNCH_COLORS = {
        benefit: '#9df27a',
        result: '#ffcc3d',
        warning: '#ff6b6b',
        hook: '#ffffff'
      };

      let T = null;

      function backOut(x) {
        const c = 1.9;
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(cl - 1, 3) + c * Math.pow(cl - 1, 2);
      }

      function easeOut(x) {
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 - Math.pow(1 - cl, 3);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg) {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [] };
        const cfg = T.config || {};
        oPhone.style.width = `${Number(cfg.width) || 720}px`;
        oPhone.style.height = `${Number(cfg.height) || 1280}px`;
        labels = SL ? SL.getLocalizedLabels(cfg.targetLanguage || T.brand?.targetLanguage || 'id-ID') : { ingredientsHeader: 'BAHAN', stepLabel: 'LANGKAH' };

        if (cfg.accentColor) {
          document.documentElement.style.setProperty('--accent', cfg.accentColor);
          document.documentElement.style.setProperty('--accent-soft', cfg.accentColor);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }

        if (cfg.fontBaseUrl) {
          const base = String(cfg.fontBaseUrl).replace(/\/+$/, '');
          dynamicFonts.textContent = `
            @font-face { font-family: "Anton"; src: url("${base}/Anton-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
            @font-face { font-family: "Inter"; src: url("${base}/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
          `;
        }

        const pos = cfg.position || 'bottom';
        let subTop = '69cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        document.documentElement.style.setProperty('--sub-top', subTop);

        oSub.className = 'sub';
        if (cfg.style === 'floating_black_on_white') oSub.classList.add('pill-mode');

        const hc = T.hookCard;
        if (hc && hc.l1) {
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.086) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.11) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const pr = T.productCard;
        if (pr && pr.name) {
          oProdTag.textContent = pr.tag || '';
          oProdTag.hidden = !pr.tag;
          oProdName.textContent = pr.name;
          oProdSpec.textContent = pr.specLine || '';
          oProdSpec.hidden = !pr.specLine;
          oProdDisc.textContent = pr.disclaimer || '';
          oProdDisc.hidden = !pr.disclaimer;
          if (pr.imageUrl) {
            oProdImg.src = pr.imageUrl;
            oProdImg.hidden = false;
          } else {
            oProdImg.removeAttribute('src');
            oProdImg.hidden = true;
          }
        } else {
          oProd.hidden = true;
        }

        const sv = T.savePrompt;
        if (sv && sv.titleText) {
          oSaveTitle.textContent = sv.titleText;
          oSaveSub.textContent = sv.subtitleText || '';
          oSaveSub.hidden = !sv.subtitleText;
        } else {
          oSave.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        // Progress bar & cut flash
        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.55 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = punches.find((p) => time >= p.s && time < p.e);
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '15.5cqw';
          if (cLen > 24) pSize = '11cqw';
          else if (cLen > 18) pSize = '12.6cqw';
          else if (cLen > 13) pSize = '14cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || PUNCH_COLORS.result;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 2);
        }

        // IngredientStack (<= 4 chips + overflow pill, hidden cleanly if empty)
        const ing = T.recipe?.ingredients;
        const ingItems = Array.isArray(ing?.items) ? ing.items : [];
        const showIng = Boolean(ingItems.length > 0 && !showHook && time >= ingItems[0].s && time < Number(ing.until || 0));
        oIng.hidden = !showIng;
        if (showIng) {
          const shown = ingItems.filter((x) => time >= x.s);
          const totalDisplay = Number(ing.totalCount || ingItems.length);
          const hd = document.createElement('div');
          hd.className = 'hd';
          hd.textContent = `${labels.ingredientsHeader || 'BAHAN'} ${shown.length}/${totalDisplay}`;
          const chipsHtml = shown.map((x, idx) => {
            const isNew = idx === shown.length - 1 && (time - x.s) < 0.55;
            const slideX = ((1 - easeOut((time - x.s) / 0.3)) * -60).toFixed(2);
            const row = document.createElement('div');
            row.className = `it${isNew ? ' new' : ''}`;
            row.style.transform = `translateX(${slideX}cqw)`;
            const ck = document.createElement('span');
            ck.className = 'ck';
            ck.textContent = '✓';
            const lb = document.createElement('span');
            lb.textContent = x.label;
            row.appendChild(ck);
            row.appendChild(lb);
            return row.outerHTML;
          }).join('');
          let moreHtml = '';
          if (ing.overflowLabel && shown.length === ingItems.length) {
            const more = document.createElement('div');
            more.className = 'more';
            more.textContent = ing.overflowLabel;
            moreHtml = more.outerHTML;
          }
          oIng.innerHTML = hd.outerHTML + chipsHtml + moreHtml;
          oIng.style.opacity = String(Math.min(1, Math.max(0, (Number(ing.until) - time) / 0.25)));
        }

        // StepBadge (3..8+ clips dynamically, priority respects Keyword Punch)
        const steps = Array.isArray(T.recipe?.steps) ? T.recipe.steps : [];
        const activeStep = steps.find((st) => time >= st.s && time < st.e);
        const showStep = Boolean(activeStep && !activePunch && !showHook);
        oStep.hidden = !showStep;
        if (showStep) {
          oStepNum.textContent = activeStep.badge || `${labels.stepLabel || 'LANGKAH'} ${activeStep.n}/${activeStep.total}`;
          oStepTxt.textContent = activeStep.t || '';
          applyPop(oStep, time, activeStep.s, activeStep.e, 0.22, 0.1, 0);
        }

        const pr = T.productCard;
        const showProd = Boolean(pr && pr.name && !activePunch && !showHook && time >= pr.s && time < pr.e);
        oProd.hidden = !showProd;
        if (showProd) {
          const slideX = (1 - easeOut((time - pr.s) / 0.35)) * -105;
          const fadeOut = Math.min(1, Math.max(0, (pr.e - time) / 0.2));
          oProd.style.transform = `translateX(${slideX.toFixed(2)}cqw)`;
          oProd.style.opacity = String(fadeOut);
        }

        const sv = T.savePrompt;
        const showSave = Boolean(sv && sv.titleText && !activePunch && time >= sv.s && time < sv.e);
        oSave.hidden = !showSave;
        if (showSave) {
          applyPop(oSave, time, sv.s, sv.e, 0.24, 0.18, 0);
        }

        const ca = T.cta;
        const showCta = Boolean(ca && ca.text && !activePunch && !showSave && time >= ca.s && time <= ca.e);
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.8;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        if (captionMode === 'keyword_only' || (captionMode === 'hybrid' && activePunch)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const chunks = Array.isArray(T.chunks) ? T.chunks : [];
        const words = Array.isArray(T.words) ? T.words : [];
        const punchWordSet = new Set(T.punchWordIndices || []);
        const activeChunk = chunks.find((ch) => time >= ch.s - 0.03 && time <= ch.e + 0.08);
        if (!activeChunk || !Array.isArray(activeChunk.indices)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const visibleIndices = captionMode === 'hybrid'
          ? activeChunk.indices.filter((idx) => !punchWordSet.has(idx))
          : activeChunk.indices;

        if (visibleIndices.length === 0) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const joinedLen = visibleIndices.map((idx) => words[idx]?.w || '').join(' ').length;
        let subCqw = '6.4cqw';
        if (joinedLen > 22) subCqw = '4.8cqw';
        else if (joinedLen > 17) subCqw = '5.5cqw';
        else if (joinedLen > 14) subCqw = '6.0cqw';
        oSub.style.setProperty('--sub-size', subCqw);

        oSub.hidden = false;
        oSub.innerHTML = visibleIndices.map((idx) => {
          const item = words[idx];
          if (!item) return '';
          const isOn = time >= item.s && time <= item.e + 0.04;
          const span = document.createElement('span');
          span.className = isOn ? 'on' : '';
          span.textContent = String(item.w || '');
          return span.outerHTML;
        }).join(' ');
      };
    })();
  </script>
</body>
</html>
