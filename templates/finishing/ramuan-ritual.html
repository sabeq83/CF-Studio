<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: var(--fx-accent);
      --accent-soft: var(--fx-accent);
      --active-word: var(--fx-accent);
      --brand: var(--fx-card);
      --f-punch: var(--fx-font-display);
      --f-sub: var(--fx-font-body);
      --f-ui: var(--fx-font-ui);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: var(--fx-card-ink);
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--fx-accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 19cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      line-height: 0.95;
      color: var(--fx-card-ink);
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, var(--fx-size-display-sm));
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.55);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 2cqw;
      font-size: var(--hook-l2-size, var(--fx-size-display));
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1cqw 3cqw 0.3cqw;
      border-radius: var(--fx-radius);
      transform: rotate(-2deg);
      box-shadow: 0 1.1cqw 2.4cqw rgba(0, 0, 0, 0.4);
    }
    .ing {
      position: absolute;
      left: 4.5cqw;
      top: 13cqh;
      max-width: 52cqw;
      display: grid;
      gap: 1cqw;
      justify-items: start;
      z-index: 6;
    }
    #oIngList {
      display: grid;
      gap: 1cqw;
      justify-items: start;
      width: 100%;
    }
    .ing .hd {
      font-family: var(--fx-font-ui);
      font-weight: 700;
      font-size: var(--fx-size-label);
      letter-spacing: 0.05em;
      color: var(--fx-card-ink);
      background: var(--fx-card);
      border-left: 0.8cqw solid var(--fx-accent);
      padding: 0.6cqw 1.8cqw;
      border-radius: var(--fx-radius);
      text-transform: var(--fx-text-case);
    }
    .ing .it {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
      background: var(--fx-chip);
      color: var(--fx-chip-ink);
      font-family: var(--fx-font-body);
      font-weight: 600;
      font-size: var(--fx-size-body);
      padding: 0.85cqw 1.8cqw 0.85cqw 1.1cqw;
      border-radius: var(--fx-radius);
      box-shadow: var(--fx-shadow);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: none;
    }
    .ing .it .ck {
      width: 3.8cqw;
      height: 3.8cqw;
      border-radius: 50%;
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      display: grid;
      place-items: center;
      font-size: 2.2cqw;
      font-family: var(--fx-font-ui);
      font-weight: 800;
      flex-shrink: 0;
    }
    .ing .it.new {
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
    }
    .ing .more {
      display: inline-block;
      font-family: var(--fx-font-ui);
      font-weight: 700;
      font-size: var(--fx-size-meta);
      color: var(--fx-card-ink);
      background: var(--fx-card);
      padding: 0.6cqw 1.8cqw;
      border-radius: var(--fx-radius);
    }
    .x-time {
      position: absolute;
      right: 15cqw;
      top: 13cqh;
      max-width: 36cqw;
      background: var(--fx-card);
      border: 0.45cqw solid var(--fx-accent);
      border-radius: var(--fx-radius);
      padding: 1.1cqw 2.2cqw;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      box-shadow: var(--fx-shadow);
      transform-origin: 100% 0%;
      z-index: 6;
    }
    .x-time i {
      font-style: normal;
      display: inline-flex;
      align-items: center;
      gap: 1.1cqw;
      font-family: var(--fx-font-ui);
      font-weight: 700;
      font-size: var(--fx-size-label);
      line-height: 1.1;
      color: var(--fx-accent);
      letter-spacing: 0.03em;
      text-transform: var(--fx-text-case);
    }
    .x-time .sub-t {
      margin-top: 0.45cqw;
      font-family: var(--fx-font-body);
      font-weight: 600;
      font-size: var(--fx-size-meta);
      line-height: 1.15;
      color: var(--fx-card-muted);
    }
    .prod {
      position: absolute;
      left: 5cqw;
      top: 14cqh;
      max-width: 78cqw;
      display: flex;
      align-items: center;
      gap: 2.3cqw;
      background: var(--fx-card);
      color: var(--fx-card-ink);
      border: 0.35cqw solid var(--fx-accent);
      border-radius: var(--fx-radius);
      padding: 1.6cqw 2.8cqw 1.6cqw 1.8cqw;
      box-shadow: var(--fx-shadow);
      z-index: 6;
    }
    .prod img {
      width: 14cqw;
      height: 14cqw;
      object-fit: contain;
      border-radius: 1.6cqw;
      background: var(--fx-chip);
      flex-shrink: 0;
    }
    .prod .tag {
      display: inline-block;
      font-family: var(--fx-font-ui);
      font-weight: 800;
      font-size: var(--fx-size-label);
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      border-radius: 1cqw;
      padding: 0.3cqw 1.2cqw;
      margin-bottom: 0.6cqw;
      text-transform: var(--fx-text-case);
    }
    .prod .pn {
      font-family: var(--fx-font-body);
      font-weight: 800;
      font-size: var(--fx-size-body);
      line-height: 1.1;
    }
    .prod .pd {
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-meta);
      color: var(--fx-card-muted);
      margin-top: 0.5cqw;
    }
    .prod .disc {
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-meta);
      color: var(--fx-card-muted);
      margin-top: 0.45cqw;
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 43cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      font-size: var(--punch-size, var(--fx-size-display));
      line-height: 0.94;
      transform-origin: 50% 50%;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.48);
    }
    .cta {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 50cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.4cqw;
    }
    .cta .arrow {
      font-family: var(--fx-font-display);
      font-size: 10cqw;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--fx-font-body);
      font-weight: 900;
      font-size: var(--fx-size-body);
      text-transform: var(--fx-text-case);
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1.4cqw 3.8cqw;
      border-radius: var(--fx-radius);
      box-shadow: 0 1.2cqw 0 var(--fx-stroke);
    }
  </style>
  <script src="./shared-layers.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="flash" id="oFlash"></div>
    <div class="ing" id="oIng" hidden>
      <div class="hd" id="oIngHd">BAHAN</div>
      <div id="oIngList"></div>
      <div class="more" id="oIngMore" hidden></div>
    </div>
    <div class="x-time" id="oTime" hidden>
      <i id="oTimeI"><span id="oTimeEmoji">⏱️</span><span id="oTimeTitle"></span></i>
      <div class="sub-t" id="oTimeSub" hidden></div>
    </div>
    <div class="prod" id="oProd" hidden>
      <img id="oProdImg" alt="" hidden>
      <div>
        <span class="tag" id="oProdTag">HERBAL UTAMA</span>
        <div class="pn" id="oProdName"></div>
        <div class="pd" id="oProdDesc" hidden></div>
        <div class="disc" id="oProdDisc" hidden></div>
      </div>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow"></div>
      <div class="pill" id="oCtaPill"></div>
    </div>
    <div class="sub" id="oSub" hidden></div>
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="layer" id="oPatch" hidden></div>
    <div class="layer" id="oBrand" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const SL = window.FinishingSharedLayers || null;
      let T = null;
      let labels = { ingredientsHeader: 'BAHAN' };

      const oFlash = document.getElementById('oFlash');
      const oProg = document.getElementById('oProg');
      const oIng = document.getElementById('oIng');
      const oIngHd = document.getElementById('oIngHd');
      const oIngList = document.getElementById('oIngList');
      const oIngMore = document.getElementById('oIngMore');
      const oTime = document.getElementById('oTime');
      const oTimeEmoji = document.getElementById('oTimeEmoji');
      const oTimeTitle = document.getElementById('oTimeTitle');
      const oTimeSub = document.getElementById('oTimeSub');
      const oProd = document.getElementById('oProd');
      const oProdImg = document.getElementById('oProdImg');
      const oProdTag = document.getElementById('oProdTag');
      const oProdName = document.getElementById('oProdName');
      const oProdDesc = document.getElementById('oProdDesc');
      const oProdDisc = document.getElementById('oProdDisc');
      const oPunch = document.getElementById('oPunch');
      const oCta = document.getElementById('oCta');
      const oCtaArrow = document.getElementById('oCtaArrow');
      const oCtaPill = document.getElementById('oCtaPill');
      const oSub = document.getElementById('oSub');
      const oHook = document.getElementById('oHook');
      const oHookL1 = document.getElementById('oHookL1');
      const oHookL2 = document.getElementById('oHookL2');
      const oPatch = document.getElementById('oPatch');
      const oBrand = document.getElementById('oBrand');
      const dynamicFonts = document.getElementById('dynamic-fonts');
      const sharedLayersCss = document.getElementById('shared-layers-css');

      if (SL && sharedLayersCss) {
        sharedLayersCss.textContent = SL.SHARED_LAYERS_CSS;
      }

      const PUNCH_COLORS = {
        problem: 'var(--fx-phase-problem)',
        benefit: 'var(--fx-accent)',
        result: 'var(--fx-phase-solution)',
        hook: 'var(--fx-accent)'
      };

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"]/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;'
        }[c]));
      }

      function easeOut(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function applyPop(el, time, s, e, inDur = 0.22, outDur = 0.16, rotDeg = 0) {
        const dt = time - s;
        const rem = e - time;
        if (dt < 0 || rem < 0) {
          el.style.opacity = '0';
          el.style.transform = `scale(0.85) rotate(${rotDeg}deg)`;
          return;
        }
        if (dt < inDur) {
          const k = Math.min(1, Math.max(0, dt / inDur));
          const sc = 0.85 + 0.15 * easeOutBack(k);
          el.style.opacity = String(k);
          el.style.transform = `scale(${sc.toFixed(4)}) rotate(${(rotDeg * k).toFixed(2)}deg)`;
        } else if (rem < outDur) {
          const k = Math.min(1, Math.max(0, rem / outDur));
          el.style.opacity = String(k);
          el.style.transform = `scale(${(0.9 + 0.1 * k).toFixed(4)}) rotate(${(rotDeg * k).toFixed(2)}deg)`;
        } else {
          el.style.opacity = '1';
          el.style.transform = `scale(1) rotate(${rotDeg}deg)`;
        }
      }

      window.loadTimeline = function (timeline) {
        T = timeline;
        const cfg = T.config || {};

        if (SL?.applySkinTokens) {
          SL.applySkinTokens(document, T.skin);
        } else if (T.skin?.tokens) {
          for (const [k, v] of Object.entries(T.skin.tokens)) {
            document.documentElement.style.setProperty(k, v);
          }
        }

        labels = SL ? SL.getLocalizedLabels(cfg.targetLanguage || T.brand?.targetLanguage || 'id-ID') : { ingredientsHeader: 'BAHAN' };

        const customAccent = cfg.accentColor || cfg.accent || (T.brand && (T.brand.accentColor || T.brand.accent));
        if (customAccent) {
          document.documentElement.style.setProperty('--fx-accent', customAccent);
          document.documentElement.style.setProperty('--accent', customAccent);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }

        if (SL?.buildDynamicFontFaces && cfg.fontBaseUrl) {
          dynamicFonts.textContent = SL.buildDynamicFontFaces(cfg.fontBaseUrl);
        }

        const pos = cfg.position || 'bottom';
        let subTop = '71cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        oSub.dataset.subTop = subTop;
        if (SL?.configureSubtitleLayer) {
          SL.configureSubtitleLayer(oSub, cfg, { subTop, subRight: '15cqw' });
        } else {
          document.documentElement.style.setProperty('--sub-top', subTop);
        }

        const hc = T.hookCard;
        if (hc && hc.l1) {
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.088) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.11) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const pc = T.productCard;
        if (pc && pc.name) {
          oProdName.textContent = pc.name;
          if (pc.specLine) {
            oProdDesc.textContent = pc.specLine;
            oProdDesc.hidden = false;
          } else {
            oProdDesc.hidden = true;
          }
          if (pc.tag) oProdTag.textContent = pc.tag;
          if (pc.imageUrl) {
            oProdImg.src = pc.imageUrl;
            oProdImg.hidden = false;
          } else {
            oProdImg.hidden = true;
          }
          if (pc.disclaimer) {
            oProdDisc.textContent = pc.disclaimer;
            oProdDisc.hidden = false;
          } else {
            oProdDisc.hidden = true;
          }
        } else {
          oProd.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.52 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null, safetyNotice: null };
        const endOn = Boolean(brandState.endCard);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(!endOn && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        // Slot resolver (Aturan Satu Fokus)
        const slot = (layer) => (T.slots || []).find((x) => x.layer === layer && time >= x.s && time < x.e);

        // Keyword Punch
        const punchSlot = slot('punch');
        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = punchSlot ? punchSlot.ref : (!endOn ? punches.find((p) => time >= p.s && time < p.e) : null);
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.displayText || activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = 'var(--fx-size-display)';
          if (cLen > 24) pSize = '10.6cqw';
          else if (cLen > 18) pSize = '12.2cqw';
          else if (cLen > 13) pSize = '13.6cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || PUNCH_COLORS.result;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 1.2);
        }

        // Ingredients (Aturan Satu Fokus: Jendela 3 chip, maks 4 detik)
        const ing = T.recipe?.ingredients;
        const ingItems = Array.isArray(ing?.items) ? ing.items : [];
        const ingSlot = slot('ingredients');
        const ingVisible = Boolean(ingSlot ? ingSlot.ref : (!endOn && !showHook && ingItems.length > 0 && time >= Number(ing?.s || ingItems[0]?.s || 0) && time <= Number(ing?.until || dur)));
        oIng.hidden = !ingVisible;
        if (ingVisible) {
          const shownTotal = ingItems.filter((it) => time >= Number(it?.s || 0)).length;
          const totalDisplay = Number(ing.totalCount || ingItems.length);
          const hdBase = ing.header || labels.ingredientsHeader || 'BAHAN';
          oIngHd.textContent = `${hdBase} ${shownTotal}/${totalDisplay}`;
          const activeWindowChips = ingItems.filter((it) => time >= Number(it?.s || 0) && (it.e ? time < Number(it.e) : true)).slice(0, 3);
          oIngList.innerHTML = activeWindowChips.map((it, idx) => {
            const labelTxt = it?.label || it?.text || it?.raw || '';
            const isNew = idx === activeWindowChips.length - 1 && (time - Number(it?.s || 0)) < 0.55;
            const slideX = ((1 - easeOut((time - Number(it?.s || 0)) / 0.28)) * -50).toFixed(2);
            return `<div class="it${isNew ? ' new' : ''}" style="transform:translateX(${slideX}cqw)"><span class="ck">✓</span><span>${escapeHtml(labelTxt)}</span></div>`;
          }).join('');
        }

        // Timing reminder badge (.x-time)
        const timeSlot = slot('timing');
        const badges = Array.isArray(T.timingBadges) ? T.timingBadges : [];
        const activeBadge = timeSlot ? timeSlot.ref : ((!endOn && !showHook && (!T.slots || T.slots.length === 0))
          ? badges.find((b) => time >= b.s && time < b.e)
          : null);
        oTime.hidden = !activeBadge;
        if (activeBadge) {
          const em = activeBadge.emoji || '⏱️';
          if (oTimeEmoji.textContent !== em) oTimeEmoji.textContent = em;
          if (oTimeTitle.textContent !== activeBadge.title) oTimeTitle.textContent = activeBadge.title;
          if (activeBadge.sub) {
            if (oTimeSub.textContent !== activeBadge.sub) oTimeSub.textContent = activeBadge.sub;
            oTimeSub.hidden = false;
          } else {
            oTimeSub.hidden = true;
          }
          applyPop(oTime, time, activeBadge.s, activeBadge.e, 0.22, 0.14, 0);
        }

        // Product Card
        const pc = T.productCard;
        const prodSlot = slot('product');
        const showProd = Boolean(prodSlot ? prodSlot.ref : (!endOn && !activePunch && !showHook && pc && pc.name && time >= pc.s && time <= pc.e));
        oProd.hidden = !showProd;
        if (showProd) {
          oProdDisc.hidden = Boolean(brandState.safetyNotice || !pc.disclaimer);
          applyPop(oProd, time, pc.s, pc.e, 0.24, 0.16, 0);
        }

        // CTA
        const ca = T.cta;
        const ctaSlot = slot('cta');
        const showCta = Boolean(ctaSlot ? ctaSlot.ref : (!endOn && !activePunch && !showProd && ca && ca.text && time >= ca.s && time <= ca.e));
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.4;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        // Subtitle
        if (SL?.renderSubtitle) {
          SL.renderSubtitle(oSub, T, time, {
            captionMode,
            activePunch,
