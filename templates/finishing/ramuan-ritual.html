<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: #e0913a;
      --accent-soft: #ecc189;
      --active-word: #fff066;
      --brand: #2f2116;
      --f-punch: "Anton", Impact, sans-serif;
      --f-sub: "Montserrat", "Arial Black", sans-serif;
      --f-ui: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 19cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      line-height: 0.95;
      color: #ffffff;
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, 8.8cqw);
      -webkit-text-stroke: 0.5cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.55);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 2cqw;
      font-size: var(--hook-l2-size, 11cqw);
      background: var(--accent);
      color: #1c120a;
      padding: 1cqw 3cqw 0.3cqw;
      border-radius: 1.2cqw;
      transform: rotate(-2deg);
      box-shadow: 0 1.1cqw 2.4cqw rgba(0, 0, 0, 0.4);
    }
    .ing {
      position: absolute;
      left: 4.5cqw;
      top: 13cqh;
      max-width: 46cqw;
      display: grid;
      gap: 1.3cqw;
      justify-items: start;
    }
    #oIngList {
      display: grid;
      gap: 1.3cqw;
      justify-items: start;
      width: 100%;
    }
    .ing .hd {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 2.8cqw;
      letter-spacing: 0.1em;
      color: #fff8ee;
      background: rgba(47, 33, 22, 0.86);
      border-left: 0.8cqw solid var(--accent);
      padding: 0.7cqw 1.9cqw;
      border-radius: 1.2cqw;
    }
    .ing .it {
      display: flex;
      align-items: center;
      gap: 1.3cqw;
      background: #fff7ec;
      color: #2b1a0e;
      font-family: var(--f-sub);
      font-weight: 800;
      font-size: 3.15cqw;
      padding: 0.95cqw 2cqw 0.95cqw 1.1cqw;
      border-radius: 99cqw;
      box-shadow: 0 1cqw 2.4cqw rgba(0, 0, 0, 0.34);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ing .it .ck {
      width: 4.3cqw;
      height: 4.3cqw;
      border-radius: 50%;
      background: var(--accent-soft);
      color: #1f130a;
      display: grid;
      place-items: center;
      font-size: 2.6cqw;
      font-family: var(--f-ui);
      font-weight: 800;
      flex-shrink: 0;
    }
    .ing .it.new {
      background: var(--accent);
      color: #1a1008;
    }
    .ing .more {
      display: inline-block;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 2.7cqw;
      color: #fff8ee;
      background: rgba(47, 33, 22, 0.86);
      padding: 0.6cqw 1.8cqw;
      border-radius: 99cqw;
    }
    .x-time {
      position: absolute;
      right: 15cqw;
      top: 13cqh;
      max-width: 34cqw;
      background: rgba(31, 21, 14, 0.92);
      border: 0.45cqw solid var(--accent);
      border-radius: 2.2cqw;
      padding: 1.15cqw 2.3cqw;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      box-shadow: 0 1.2cqw 2.8cqw rgba(0, 0, 0, 0.45);
      transform-origin: 100% 0%;
    }
    .x-time i {
      font-style: normal;
      display: inline-flex;
      align-items: center;
      gap: 1.1cqw;
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 3cqw;
      line-height: 1.1;
      color: var(--accent);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .x-time .sub-t {
      margin-top: 0.45cqw;
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 2.45cqw;
      line-height: 1.15;
      color: #faf3ea;
    }
    .prod {
      position: absolute;
      left: 5cqw;
      top: 34cqh;
      max-width: 78cqw;
      display: flex;
      align-items: center;
      gap: 2.3cqw;
      background: #fffcf7;
      color: #1e140c;
      border: 0.35cqw solid rgba(224, 145, 58, 0.45);
      border-radius: 2.8cqw;
      padding: 1.8cqw 3cqw 1.8cqw 1.9cqw;
      box-shadow: 0 1.6cqw 4.2cqw rgba(0, 0, 0, 0.4);
    }
    .prod img {
      width: 14.5cqw;
      height: 14.5cqw;
      object-fit: contain;
      border-radius: 2cqw;
      background: #ffffff;
      flex-shrink: 0;
    }
    .prod .tag {
      display: inline-block;
      font-family: var(--f-ui);
      font-weight: 800;
      font-size: 2.2cqw;
      background: var(--accent);
      color: #1c120a;
      border-radius: 1cqw;
      padding: 0.3cqw 1.2cqw;
      margin-bottom: 0.6cqw;
      text-transform: uppercase;
    }
    .prod .pn {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 3.9cqw;
      line-height: 1.08;
    }
    .prod .pd {
      font-family: var(--f-ui);
      font-size: 2.45cqw;
      color: #5b4838;
      margin-top: 0.5cqw;
    }
    .prod .disc {
      font-family: var(--f-ui);
      font-size: 2cqw;
      color: #6b5d52;
      margin-top: 0.45cqw;
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 43cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      font-size: var(--punch-size, 15cqw);
      line-height: 0.94;
      transform-origin: 50% 50%;
      -webkit-text-stroke: 0.62cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.48);
    }
    .cta {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 50cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.4cqw;
    }
    .cta .arrow {
      font-family: var(--f-punch);
      font-size: 10cqw;
      color: var(--accent);
      -webkit-text-stroke: 0.45cqw #000000;
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 4.4cqw;
      text-transform: uppercase;
      background: var(--accent);
      color: #1c120a;
      padding: 1.4cqw 3.8cqw;
      border-radius: 99cqw;
      box-shadow: 0 1.2cqw 0 #000000;
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="flash" id="oFlash"></div>
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="ing" id="oIng" hidden>
      <div class="hd" id="oIngHd"></div>
      <div id="oIngList"></div>
      <div class="more" id="oIngMore" hidden></div>
    </div>
    <div class="x-time" id="oTime" hidden>
      <i><span id="oTimeEmoji"></span><span id="oTimeTitle"></span></i>
      <span class="sub-t" id="oTimeSub" hidden></span>
    </div>
    <div class="prod" id="oProd" hidden>
      <img id="oProdImg" alt="" hidden>
      <div>
        <span class="tag" id="oProdTag" hidden></span>
        <div class="pn" id="oProdName"></div>
        <div class="pd" id="oProdSpec" hidden></div>
        <div class="disc" id="oProdDisc" hidden></div>
      </div>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow"></div>
      <div class="pill" id="oCtaPill"></div>
    </div>
    <div class="sub" id="oSub" hidden></div>
    <div class="layer" id="oPatch" hidden></div>
    <div class="layer" id="oBrand" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script src="./shared-layers.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oFlash = $('oFlash');
      const oHook = $('oHook');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oIng = $('oIng');
      const oIngHd = $('oIngHd');
      const oIngList = $('oIngList');
      const oIngMore = $('oIngMore');
      const oTime = $('oTime');
      const oTimeEmoji = $('oTimeEmoji');
      const oTimeTitle = $('oTimeTitle');
      const oTimeSub = $('oTimeSub');
      const oProd = $('oProd');
      const oProdImg = $('oProdImg');
      const oProdTag = $('oProdTag');
      const oProdName = $('oProdName');
      const oProdSpec = $('oProdSpec');
      const oProdDisc = $('oProdDisc');
      const oPunch = $('oPunch');
      const oCta = $('oCta');
      const oCtaArrow = $('oCtaArrow');
      const oCtaPill = $('oCtaPill');
      const oSub = $('oSub');
      const oPatch = $('oPatch');
      const oBrand = $('oBrand');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');
      const sharedCssEl = $('shared-layers-css');
      const SL = window.FinishingSharedLayers || null;

      if (SL && sharedCssEl) {
        sharedCssEl.textContent = SL.SHARED_LAYERS_CSS || '';
      }

      const PUNCH_COLORS = {
        benefit: '#9df27a',
        result: '#e0913a',
        number: '#ffcc3d',
        warning: '#ff6b6b',
        problem: '#ff6b6b',
        hook: '#ffffff'
      };

      let T = null;
      let labels = SL ? SL.getLocalizedLabels('id-ID') : { ingredientsHeader: 'BAHAN', defaultCta: '' };

      function backOut(x) {
        const c = 1.9;
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(cl - 1, 3) + c * Math.pow(cl - 1, 2);
      }

      function easeOut(x) {
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 - Math.pow(1 - cl, 3);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg) {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"]/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;'
        }[c]));
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [], timingBadges: [] };
        const cfg = T.config || {};
        oPhone.style.width = `${Number(cfg.width) || 720}px`;
        oPhone.style.height = `${Number(cfg.height) || 1280}px`;

        const customAccent = T.brand?.accentColor || (cfg.accentColor && cfg.accentColor !== '#ffcc3d' ? cfg.accentColor : '');
        if (customAccent) {
          document.documentElement.style.setProperty('--accent', customAccent);
          document.documentElement.style.setProperty('--accent-soft', customAccent);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }
        if (T.brand?.color) {
          document.documentElement.style.setProperty('--brand', T.brand.color);
        }

        if (SL) {
          labels = SL.getLocalizedLabels(cfg.targetLanguage || T.brand?.targetLanguage || 'id-ID');
        }

        if (cfg.fontBaseUrl) {
          const base = String(cfg.fontBaseUrl).replace(/\/+$/, '');
          dynamicFonts.textContent = `
            @font-face { font-family: "Anton"; src: url("${base}/Anton-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
            @font-face { font-family: "Inter"; src: url("${base}/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
          `;
        }

        const pos = cfg.position || 'bottom';
        let subTop = '71cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        oSub.dataset.subTop = subTop;
        if (SL?.configureSubtitleLayer) {
          SL.configureSubtitleLayer(oSub, cfg, { subTop, subRight: '15cqw' });
        } else {
          document.documentElement.style.setProperty('--sub-top', subTop);
        }

        const hc = T.hookCard;
        if (hc && hc.l1) {
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.096) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.112) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const rec = T.recipe;
        if (rec?.ingredients?.header) {
          oIngHd.textContent = rec.ingredients.header;
        } else {
          oIngHd.textContent = labels.ingredientsHeader || 'BAHAN';
        }
        oIngList.dataset.k = '';
        oIngMore.hidden = true;

        const pc = T.productCard;
        if (pc && pc.name) {
          if (pc.imageUrl) {
            oProdImg.src = pc.imageUrl;
            oProdImg.hidden = false;
          } else {
            oProdImg.removeAttribute('src');
            oProdImg.hidden = true;
          }
          const tagTxt = pc.tag || pc.badgeLabel || '';
          if (tagTxt) {
            oProdTag.textContent = tagTxt;
            oProdTag.hidden = false;
          } else {
            oProdTag.hidden = true;
          }
          oProdName.textContent = pc.name;
          if (pc.specLine) {
            oProdSpec.textContent = pc.specLine;
            oProdSpec.hidden = false;
          } else {
            oProdSpec.hidden = true;
          }
          if (pc.disclaimer) {
            oProdDisc.textContent = pc.disclaimer;
            oProdDisc.hidden = false;
          } else {
            oProdDisc.hidden = true;
          }
        } else {
          oProd.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.52 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null, safetyNotice: null };
        const endOn = Boolean(brandState.endCard);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(!endOn && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        // Concise ingredient chips (left safe zone >= 13cqh; aligns with extractRecipeOverlayData { until, items: [{ label, s }], totalCount, overflowLabel })
        const ing = T.recipe?.ingredients;
        const ingItems = Array.isArray(ing?.items) ? ing.items : [];
        const ingStart = Number(ing?.s ?? ingItems[0]?.s ?? 0);
        const ingEnd = Number(ing?.until || ing?.e || dur);
        const unlocked = ingItems.filter((it) => time >= Number(it?.s || 0));
        const ingVisible = Boolean(
          !endOn && !showHook && ing && unlocked.length > 0 && time >= ingStart && time <= ingEnd
        );
        oIng.hidden = !ingVisible;
        if (ingVisible) {
          const totalDisplay = Number(ing.totalCount || ingItems.length);
          const hdBase = ing.header || labels.ingredientsHeader || 'BAHAN';
          oIngHd.textContent = `${hdBase} ${unlocked.length}/${totalDisplay}`;
          const displayItems = unlocked.slice(0, 4);
          oIngList.innerHTML = displayItems.map((it, idx) => {
            const labelTxt = it?.label || it?.text || it?.raw || '';
            const isNew = idx === displayItems.length - 1 && (time - Number(it?.s || 0)) < 0.7;
            const slideX = ((1 - easeOut((time - Number(it?.s || 0)) / 0.28)) * -50).toFixed(2);
            return `<div class="it${isNew ? ' new' : ''}" style="transform:translateX(${slideX}cqw)"><span class="ck">✓</span><span>${escapeHtml(labelTxt)}</span></div>`;
          }).join('');
          if (ing.overflowLabel) {
            oIngMore.textContent = ing.overflowLabel;
            oIngMore.hidden = false;
          } else if (unlocked.length > 4) {
            oIngMore.textContent = `+${unlocked.length - 4}`;
            oIngMore.hidden = false;
          } else {
            oIngMore.hidden = true;
          }
        }

        // Timing reminder badge (.x-time) synced to VO phrase triggers (right safe zone)
        const badges = Array.isArray(T.timingBadges) ? T.timingBadges : [];
        const activeBadge = (!endOn && !showHook)
          ? badges.find((b) => time >= b.s && time < b.e)
          : null;
        oTime.hidden = !activeBadge;
        if (activeBadge) {
          const em = activeBadge.emoji || '⏱️';
          if (oTimeEmoji.textContent !== em) oTimeEmoji.textContent = em;
          if (oTimeTitle.textContent !== activeBadge.title) oTimeTitle.textContent = activeBadge.title;
          if (activeBadge.sub) {
            if (oTimeSub.textContent !== activeBadge.sub) oTimeSub.textContent = activeBadge.sub;
            oTimeSub.hidden = false;
          } else {
            oTimeSub.hidden = true;
          }
          applyPop(oTime, time, activeBadge.s, activeBadge.e, 0.22, 0.14, 0);
        }

        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = !endOn ? punches.find((p) => time >= p.s && time < p.e) : null;
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.displayText || activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '15cqw';
          if (cLen > 24) pSize = '10.6cqw';
          else if (cLen > 18) pSize = '12.2cqw';
          else if (cLen > 13) pSize = '13.6cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || PUNCH_COLORS.result;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 1.2);
        }

        const pc = T.productCard;
        const showProd = Boolean(!endOn && !activePunch && !showHook && pc && pc.name && time >= pc.s && time <= pc.e);
        oProd.hidden = !showProd;
        if (showProd) {
          oProdDisc.hidden = Boolean(brandState.safetyNotice || !pc.disclaimer);
          applyPop(oProd, time, pc.s, pc.e, 0.24, 0.16, 0);
        }

        const ca = T.cta;
        const showCta = Boolean(!endOn && !activePunch && !showProd && ca && ca.text && time >= ca.s && time <= ca.e);
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.4;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        if (SL?.renderSubtitle) {
          SL.renderSubtitle(oSub, T, time, {
            captionMode,
            activePunch,
            hidden: endOn,
            subTop: oSub.dataset.subTop || '71cqh',
            subRight: '15cqw'
          });
        }
      };
    })();
  </script>
</body>
</html>
