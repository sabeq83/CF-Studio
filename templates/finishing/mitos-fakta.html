<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: #3fbf7f;
      --accent-soft: #7ee3af;
      --active-word: #3fbf7f;
      --brand: #12261c;
      --f-punch: "Anton", Impact, sans-serif;
      --f-sub: "Montserrat", "Arial Black", sans-serif;
      --f-ui: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 6cqw;
      top: 23cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      line-height: 0.95;
      color: #ffffff;
      transform-origin: 50% 50%;
    }
    .hook.question {
      top: 19cqh;
    }
    .hook .qmark {
      display: block;
      font-family: var(--f-punch);
      font-size: 24cqw;
      line-height: 0.8;
      color: var(--accent);
      -webkit-text-stroke: 0.6cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.1cqw 2cqw rgba(0, 0, 0, 0.55);
      margin-bottom: 1.2cqw;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, 10cqw);
      letter-spacing: 0.01em;
      -webkit-text-stroke: 0.52cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.1cqw 2.2cqw rgba(0, 0, 0, 0.62);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 2cqw;
      font-size: var(--hook-l2-size, 11.5cqw);
      background: var(--accent);
      color: #111111;
      padding: 1cqw 3.2cqw 0.35cqw;
      border-radius: 1.4cqw;
      transform: rotate(-2.2deg);
      box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.42);
    }
    .x-stamp {
      position: absolute;
      left: 6cqw;
      right: 6cqw;
      top: 15cqh;
      border-radius: 3cqw;
      padding: 3cqw 4cqw 3.4cqw;
      text-align: center;
      box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, 0.45);
      transform-origin: 50% 0%;
    }
    .x-stamp.myth {
      background: #2a0f10;
      border: 0.7cqw solid #ff5a4a;
      color: #ffffff;
    }
    .x-stamp.fact {
      background: #ffffff;
      border: 0.7cqw solid #1f9d55;
      color: #111111;
    }
    .x-stamp .tg {
      display: inline-block;
      font-family: var(--f-punch);
      font-size: 8.6cqw;
      line-height: 1;
      padding: 0.7cqw 3cqw 0.4cqw;
      border-radius: 1.4cqw;
      transform: rotate(-4deg);
      letter-spacing: 0.03em;
    }
    .x-stamp.myth .tg {
      background: #ff5a4a;
      color: #ffffff;
    }
    .x-stamp.fact .tg {
      background: #1f9d55;
      color: #ffffff;
    }
    .x-stamp .tx {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 5.4cqw;
      line-height: 1.15;
      margin-top: 2.2cqw;
    }
    .x-stamp .why {
      margin-top: 2.2cqw;
      font-family: var(--f-ui);
      font-size: 3.3cqw;
      font-weight: 600;
      line-height: 1.25;
      color: #444444;
    }
    .x-stamp.myth .why {
      color: rgba(255, 255, 255, 0.86);
    }
    .x-stamp .why b {
      display: inline-block;
      font-family: var(--f-sub);
      font-weight: 900;
      background: #111111;
      color: #ffffff;
      border-radius: 1cqw;
      padding: 0.3cqw 1.6cqw;
      margin-right: 1.4cqw;
      font-size: 3cqw;
      letter-spacing: 0.08em;
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 5cqw;
      top: 46cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      font-size: var(--punch-size, 14cqw);
      line-height: 0.94;
      color: #ffffff;
      transform-origin: 50% 50%;
      -webkit-text-stroke: 0.6cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.4cqw 0 rgba(0, 0, 0, 0.45);
    }
    .cta {
      position: absolute;
      left: 0;
      right: 0;
      top: 48cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.5cqw;
      transform-origin: 50% 50%;
    }
    .cta .arrow {
      font-family: var(--f-punch);
      font-size: 11.5cqw;
      color: var(--accent);
      -webkit-text-stroke: 0.5cqw #000000;
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 4.8cqw;
      text-transform: uppercase;
      background: var(--accent);
      color: #111111;
      padding: 1.6cqw 4.4cqw;
      border-radius: 99cqw;
      box-shadow: 0 1.4cqw 0 #000000;
      text-align: center;
      max-width: 88cqw;
    }
    .sub {
      position: absolute;
      left: 7cqw;
      right: 7cqw;
      top: var(--sub-top, 72.5cqh);
      transform: translateY(-50%);
      text-align: center;
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: var(--sub-size, 6.4cqw);
      line-height: 1.18;
      text-transform: uppercase;
      color: #ffffff;
      -webkit-text-stroke: 0.52cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 0.6cqw 1.6cqw rgba(0, 0, 0, 0.65);
    }
    .sub.pill-mode span {
      background: rgba(255, 255, 255, 0.94);
      color: #111111;
      -webkit-text-stroke: 0;
      text-shadow: none;
      padding: 0.45cqw 1.6cqw;
      border-radius: 1.6cqw;
      box-shadow: 0 0.6cqw 1.4cqw rgba(0, 0, 0, 0.35);
    }
    .sub.pill-mode span.on {
      background: var(--accent);
      color: #111111;
    }
    .sub.minimal-mode {
      font-size: 4.8cqw;
      -webkit-text-stroke: 0.32cqw #000000;
    }
    .sub span {
      display: inline-block;
      margin: 0 0.55cqw;
    }
    .sub span.on {
      color: var(--active-word);
      transform: scale(1.08);
    }
  </style>
  <script src="./shared-layers.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="layer" id="oPatch" hidden></div>

    <div class="hook" id="oHook" hidden>
      <span class="qmark" id="oHookQmark" hidden>?</span>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>

    <div class="x-stamp" id="oStamp" hidden>
      <span class="tg" id="oStampTag"></span>
      <div class="tx" id="oStampText"></div>
      <div class="why" id="oStampWhyWrap" hidden>
        <b id="oStampWhyLabel"></b><span id="oStampWhyText"></span>
      </div>
    </div>

    <div class="punch" id="oPunch" hidden></div>

    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow">&#9660;</div>
      <div class="pill" id="oCtaPill"></div>
    </div>

    <div class="sub" id="oSub"></div>
    <div class="layer" id="oBrand" hidden></div>

    <div class="flash" id="oFlash"></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oFlash = $('oFlash');
      const oHook = $('oHook');
      const oHookQmark = $('oHookQmark');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oStamp = $('oStamp');
      const oStampTag = $('oStampTag');
      const oStampText = $('oStampText');
      const oStampWhyWrap = $('oStampWhyWrap');
      const oStampWhyLabel = $('oStampWhyLabel');
      const oStampWhyText = $('oStampWhyText');
      const oPunch = $('oPunch');
      const oCta = $('oCta');
      const oCtaArrow = $('oCtaArrow');
      const oCtaPill = $('oCtaPill');
      const oSub = $('oSub');
      const oPatch = $('oPatch');
      const oBrand = $('oBrand');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');
      const sharedCssEl = $('shared-layers-css');
      const SL = window.FinishingSharedLayers || null;

      if (SL && sharedCssEl) {
        sharedCssEl.textContent = SL.SHARED_LAYERS_CSS || '';
      }

      const PUNCH_COLORS = {
        problem: '#ffffff',
        warning: '#ff5a4a',
        benefit: '#9df27a',
        result: '#ffcc3d',
        number: '#ffe14d',
        hook: '#ff8a1f'
      };

      let T = null;
      let labels = { myth: 'MITOS', fact: 'FAKTA', why: 'KENAPA?' };

      function backOut(x) {
        const c = 1.9;
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(cl - 1, 3) + c * Math.pow(cl - 1, 2);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg, extraTransform = '') {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `${extraTransform}scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [], mythFact: [] };
        const cfg = T.config || {};
        oPhone.style.width = `${Number(cfg.width) || 720}px`;
        oPhone.style.height = `${Number(cfg.height) || 1280}px`;

        labels = SL ? SL.getLocalizedLabels(cfg.targetLanguage) : { myth: 'MITOS', fact: 'FAKTA', why: 'KENAPA?' };
        oStampWhyLabel.textContent = labels.why || 'KENAPA?';

        const customAccent = T.brand?.accentColor || (cfg.accentColor && cfg.accentColor !== '#ffcc3d' ? cfg.accentColor : '');
        if (customAccent) {
          document.documentElement.style.setProperty('--accent', customAccent);
          document.documentElement.style.setProperty('--accent-soft', customAccent);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }
        if (T.brand?.color) {
          document.documentElement.style.setProperty('--brand', T.brand.color);
        }

        if (cfg.fontBaseUrl) {
          const base = String(cfg.fontBaseUrl).replace(/\/+$/, '');
          dynamicFonts.textContent = `
            @font-face { font-family: "Anton"; src: url("${base}/Anton-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
            @font-face { font-family: "Inter"; src: url("${base}/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
          `;
        }

        const pos = cfg.position || 'bottom';
        let subTop = '72.5cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        document.documentElement.style.setProperty('--sub-top', subTop);

        oSub.className = 'sub';
        if (cfg.style === 'floating_black_on_white') oSub.classList.add('pill-mode');
        else if (cfg.style === 'minimal_white') oSub.classList.add('minimal-mode');

        const hc = T.hookCard;
        if (hc && hc.l1) {
          const isQuestion = Boolean(hc.question || /\?/.test(`${hc.text || ''} ${hc.l1} ${hc.l2 || ''}`));
          oHook.className = isQuestion ? 'hook question' : 'hook';
          oHookQmark.hidden = !isQuestion;
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.10) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.115) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.52 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null };
        const endOn = Boolean(brandState.endCard);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(!endOn && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.28, 0.18, 0);
        }

        // MITOS / FAKTA Stamp Card (VO-grounded & medical-claim guarded on FAKTA)
        const mfList = Array.isArray(T.mythFact) ? T.mythFact : [];
        const activeMf = (!endOn && !showHook)
          ? mfList.find((m) => time >= m.s && time < m.e)
          : null;
        oStamp.hidden = !activeMf;
        if (activeMf) {
          const isFact = activeMf.type === 'fact';
          oStamp.className = `x-stamp ${isFact ? 'fact' : 'myth'}`;
          const tagStr = isFact ? `✅ ${labels.fact || 'FAKTA'}` : `❌ ${labels.myth || 'MITOS'}`;
          if (oStampTag.textContent !== tagStr) oStampTag.textContent = tagStr;
          if (oStampText.textContent !== activeMf.text) oStampText.textContent = activeMf.text;
          if (isFact && activeMf.why) {
            if (oStampWhyText.textContent !== activeMf.why) oStampWhyText.textContent = activeMf.why;
            oStampWhyWrap.hidden = false;
          } else {
            oStampWhyWrap.hidden = true;
          }
          const rot = isFact ? 1.5 : -1.5;
          const shake = !isFact && (time - activeMf.s) < 0.35
            ? `translateX(${(Math.sin((time - activeMf.s) * 80) * 1).toFixed(2)}cqw) `
            : '';
          applyPop(oStamp, time, activeMf.s, activeMf.e, 0.28, 0.15, rot, shake);
        }

        // Keyword Punch
        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = (!endOn && !showHook) ? punches.find((p) => time >= p.s && time < p.e) : null;
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.displayText || activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '14.5cqw';
          if (cLen > 24) pSize = '10.6cqw';
          else if (cLen > 18) pSize = '12cqw';
          else if (cLen > 13) pSize = '13.2cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || '#ffffff';
          const isProb = activePunch.type === 'problem' || activePunch.type === 'warning';
          const rot = isProb ? -2.5 : 2;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, rot);
        }

        const ca = T.cta;
        const showCta = Boolean(!endOn && !activePunch && !showHook && !activeMf && ca && ca.text && time >= ca.s && time <= ca.e);
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.4;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        if (endOn || captionMode === 'keyword_only' || (captionMode === 'hybrid' && activePunch)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const chunks = Array.isArray(T.chunks) ? T.chunks : [];
        const words = Array.isArray(T.words) ? T.words : [];
        const punchWordSet = new Set(T.punchWordIndices || []);
        const activeChunk = chunks.find((ch) => time >= ch.s - 0.03 && time <= ch.e + 0.08);
        if (!activeChunk || !Array.isArray(activeChunk.indices)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const visibleIndices = captionMode === 'hybrid'
          ? activeChunk.indices.filter((idx) => !punchWordSet.has(idx))
          : activeChunk.indices;

        if (visibleIndices.length === 0) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const joinedLen = visibleIndices.map((idx) => words[idx]?.w || '').join(' ').length;
        let subCqw = '6.4cqw';
        if (joinedLen > 22) subCqw = '4.8cqw';
        else if (joinedLen > 17) subCqw = '5.5cqw';
        else if (joinedLen > 14) subCqw = '6.0cqw';
        oSub.style.setProperty('--sub-size', subCqw);

        oSub.hidden = false;
        oSub.innerHTML = visibleIndices.map((idx) => {
          const item = words[idx];
          if (!item) return '';
          const isOn = time >= item.s && time <= item.e + 0.04;
          const span = document.createElement('span');
          span.className = isOn ? 'on' : '';
          span.textContent = String(item.w || '');
          return span.outerHTML;
        }).join(' ');
      };
    })();
  </script>
</body>
</html>
