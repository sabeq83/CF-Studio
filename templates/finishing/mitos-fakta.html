<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: var(--fx-accent);
      --accent-soft: var(--fx-accent);
      --active-word: var(--fx-accent);
      --brand: var(--fx-card);
      --f-punch: var(--fx-font-display);
      --f-sub: var(--fx-font-body);
      --f-ui: var(--fx-font-ui);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: var(--fx-card-ink);
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--fx-accent);
    }
    .hook {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 23cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      line-height: 0.95;
      color: var(--fx-card-ink);
      transform-origin: 50% 50%;
    }
    .hook.question {
      top: 19cqh;
    }
    .hook .qmark {
      display: block;
      font-family: var(--fx-font-display);
      font-size: 24cqw;
      line-height: 0.8;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.1cqw 2cqw var(--fx-shadow, rgba(0, 0, 0, 0.55));
      margin-bottom: 1.2cqw;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, var(--fx-size-display-sm));
      letter-spacing: 0.01em;
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.1cqw 2.2cqw var(--fx-shadow, rgba(0, 0, 0, 0.62));
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 2cqw;
      font-size: var(--hook-l2-size, var(--fx-size-display));
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1cqw 3.2cqw 0.35cqw;
      border-radius: var(--fx-radius);
      transform: rotate(-2.2deg);
      box-shadow: 0 1.2cqw 2.4cqw var(--fx-shadow, rgba(0, 0, 0, 0.42));
    }
    .x-stamp {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 15cqh;
      border-radius: var(--fx-radius, 2.4cqw);
      padding: 3cqw 4cqw 3.4cqw;
      text-align: center;
      box-shadow: var(--fx-shadow, 0 2cqw 5cqw rgba(0, 0, 0, 0.45));
      transform-origin: 50% 0%;
      background: var(--fx-card);
      color: var(--fx-card-ink);
    }
    .x-stamp.myth {
      border: 0.7cqw solid var(--fx-phase-problem);
    }
    .x-stamp.fact {
      border: 0.7cqw solid var(--fx-phase-solution);
    }
    .x-stamp .tg {
      display: inline-block;
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-label, 4.5cqw);
      line-height: 1;
      padding: 0.7cqw 3cqw 0.4cqw;
      border-radius: var(--fx-radius, 1.4cqw);
      transform: rotate(-4deg);
      letter-spacing: 0.03em;
      text-transform: var(--fx-text-case, uppercase);
    }
    .x-stamp.myth .tg {
      background: var(--fx-phase-problem);
      color: var(--fx-accent-ink);
    }
    .x-stamp.fact .tg {
      background: var(--fx-phase-solution);
      color: var(--fx-accent-ink);
    }
    .x-stamp .tx {
      font-family: var(--fx-font-body);
      font-weight: 700;
      font-size: var(--fx-size-body, 4.2cqw);
      line-height: 1.15;
      margin-top: 2.2cqw;
      color: var(--fx-card-ink);
    }
    .x-stamp .why {
      margin-top: 2.2cqw;
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-meta, 2.8cqw);
      font-weight: 600;
      line-height: 1.25;
      color: var(--fx-card-muted);
    }
    .x-stamp.myth .why {
      color: var(--fx-card-muted);
    }
    .x-stamp .why b {
      display: inline-block;
      font-family: var(--fx-font-ui);
      font-weight: 900;
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      border-radius: var(--fx-radius, 1cqw);
      padding: 0.3cqw 1.6cqw;
      margin-right: 1.4cqw;
      font-size: var(--fx-size-meta, 2.6cqw);
      letter-spacing: 0.08em;
    }
    .punch {
      position: absolute;
      left: 4cqw;
      right: 15cqw;
      top: 46cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      font-size: var(--punch-size, var(--fx-size-display));
      line-height: 0.94;
      color: var(--fx-card-ink);
      transform-origin: 50% 50%;
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.4cqw 0 var(--fx-shadow, rgba(0, 0, 0, 0.45));
    }
    .cta {
      position: absolute;
      left: 4cqw;
      right: 15cqw;
      top: 48cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.5cqw;
      transform-origin: 50% 50%;
    }
    .cta .arrow {
      font-family: var(--fx-font-display);
      font-size: 11.5cqw;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--fx-font-body);
      font-weight: 900;
      font-size: var(--fx-size-body);
      text-transform: var(--fx-text-case);
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1.6cqw 4.4cqw;
      border-radius: var(--fx-radius, 99cqw);
      box-shadow: 0 1.4cqw 0 var(--fx-stroke);
      text-align: center;
      max-width: 88cqw;
    }
  </style>
  <script src="./shared-layers.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="layer" id="oPatch" hidden></div>

    <div class="hook" id="oHook" hidden>
      <span class="qmark" id="oHookQmark" hidden>?</span>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>

    <div class="x-stamp" id="oStamp" hidden>
      <span class="tg" id="oStampTag"></span>
      <div class="tx" id="oStampText"></div>
      <div class="why" id="oStampWhyWrap" hidden>
        <b id="oStampWhyLabel"></b><span id="oStampWhyText"></span>
      </div>
    </div>

    <div class="punch" id="oPunch" hidden></div>

    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow">▼</div>
      <div class="pill" id="oCtaPill"></div>
    </div>

    <div class="sub" id="oSub"></div>
    <div class="layer" id="oBrand" hidden></div>

    <div class="flash" id="oFlash"></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oFlash = $('oFlash');
      const oHook = $('oHook');
      const oHookQmark = $('oHookQmark');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oStamp = $('oStamp');
      const oStampTag = $('oStampTag');
      const oStampText = $('oStampText');
      const oStampWhyWrap = $('oStampWhyWrap');
      const oStampWhyLabel = $('oStampWhyLabel');
      const oStampWhyText = $('oStampWhyText');
      const oPunch = $('oPunch');
      const oCta = $('oCta');
      const oCtaArrow = $('oCtaArrow');
      const oCtaPill = $('oCtaPill');
      const oSub = $('oSub');
      const oPatch = $('oPatch');
      const oBrand = $('oBrand');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');
      const sharedCssEl = $('shared-layers-css');
      const SL = window.FinishingSharedLayers || null;

      if (SL && sharedCssEl) {
        sharedCssEl.textContent = SL.SHARED_LAYERS_CSS || '';
      }

      const PUNCH_COLORS = {
        problem: 'var(--fx-phase-problem)',
        warning: 'var(--fx-phase-cause)',
        benefit: 'var(--fx-phase-solution)',
        result: 'var(--fx-accent)',
        number: 'var(--fx-accent)',
        hook: 'var(--fx-accent)'
      };

      let T = null;
      let labels = { myth: 'MITOS', fact: 'FAKTA', why: 'KENAPA?' };

      function backOut(x) {
        const c = 1.9;
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(cl - 1, 3) + c * Math.pow(cl - 1, 2);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg, extraTransform = '') {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `${extraTransform}scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [], mythFact: [] };
        const cfg = T.config || {};
        oPhone.style.width = `${Number(cfg.width) || 720}px`;
        oPhone.style.height = `${Number(cfg.height) || 1280}px`;

        if (SL?.applySkinTokens) {
          SL.applySkinTokens(document, T.skin);
        } else if (T.skin?.tokens) {
          for (const [k, v] of Object.entries(T.skin.tokens)) {
            document.documentElement.style.setProperty(k, v);
          }
        }

        labels = SL ? SL.getLocalizedLabels(cfg.targetLanguage) : { myth: 'MITOS', fact: 'FAKTA', why: 'KENAPA?' };
        oStampWhyLabel.textContent = labels.why || 'KENAPA?';

        const customAccent = T.brand?.accentColor || (cfg.accentColor && cfg.accentColor !== 'default' ? cfg.accentColor : '');
        if (customAccent) {
          document.documentElement.style.setProperty('--fx-accent', customAccent);
          document.documentElement.style.setProperty('--accent', customAccent);
          document.documentElement.style.setProperty('--accent-soft', customAccent);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }
        if (T.brand?.color) {
          document.documentElement.style.setProperty('--brand', T.brand.color);
        }

        if (SL?.buildDynamicFontFaces && cfg.fontBaseUrl) {
          dynamicFonts.textContent = SL.buildDynamicFontFaces(cfg.fontBaseUrl);
        }

        const pos = cfg.position || 'bottom';
        let subTop = '72.5cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        oSub.dataset.subTop = subTop;
        if (SL?.configureSubtitleLayer) {
          SL.configureSubtitleLayer(oSub, cfg, { subTop, subRight: '15cqw' });
        } else {
          document.documentElement.style.setProperty('--sub-top', subTop);
        }

        const hc = T.hookCard;
        if (hc && hc.l1) {
          const isQuestion = Boolean(hc.question || /\?/.test(`${hc.text || ''} ${hc.l1} ${hc.l2 || ''}`));
          oHook.className = isQuestion ? 'hook question' : 'hook';
          oHookQmark.hidden = !isQuestion;
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.10) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.115) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.52 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null };
        const endOn = Boolean(brandState.endCard);

        // Slot resolver (Aturan Satu Fokus)
        const slot = (layer) => (T.slots || []).find((x) => x.layer === layer && time >= x.s && time < x.e);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const hookSlot = slot('hook');
        const showHook = Boolean(!endOn && ((hookSlot && T.hookCard && T.hookCard.l1) || (!T.slots && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd)));
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.28, 0.18, 0);
        }

        // MITOS / FAKTA Stamp Card (VO-grounded & medical-claim guarded on FAKTA)
        const mfList = Array.isArray(T.mythFact) ? T.mythFact : [];
        const tipSlot = slot('mythFact') || slot('tip') || slot('chapter');
        const activeMf = tipSlot
          ? (tipSlot.ref || mfList.find((m) => time >= m.s && time < m.e))
          : ((!endOn && !showHook && (!T.slots || T.slots.length === 0))
              ? mfList.find((m) => time >= m.s && time < m.e)
              : null);

        oStamp.hidden = !activeMf;
        if (activeMf) {
          const isFact = activeMf.type === 'fact';
          oStamp.className = `x-stamp ${isFact ? 'fact' : 'myth'}`;
          const tagStr = isFact ? `✅ ${labels.fact || 'FAKTA'}` : `❌ ${labels.myth || 'MITOS'}`;
          if (oStampTag.textContent !== tagStr) oStampTag.textContent = tagStr;
          if (oStampText.textContent !== activeMf.text) oStampText.textContent = activeMf.text;
          if (isFact && activeMf.why) {
            if (oStampWhyText.textContent !== activeMf.why) oStampWhyText.textContent = activeMf.why;
            oStampWhyWrap.hidden = false;
          } else {
            oStampWhyWrap.hidden = true;
          }
          const rot = isFact ? 1.5 : -1.5;
          const shake = !isFact && (time - activeMf.s) < 0.35
            ? `translateX(${(Math.sin((time - activeMf.s) * 80) * 1).toFixed(2)}cqw) `
            : '';
          applyPop(oStamp, time, activeMf.s, activeMf.e, 0.28, 0.15, rot, shake);
        }

        // Keyword Punch
        const punches = Array.isArray(T.punches) ? T.punches : [];
        const punchSlot = slot('punch');
        const activePunch = punchSlot
          ? (punchSlot.ref || punches.find((p) => time >= p.s && time < p.e))
          : ((!endOn && !showHook && (!T.slots || T.slots.length === 0))
              ? punches.find((p) => time >= p.s && time < p.e)
              : null);

        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.displayText || activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '14.5cqw';
          if (cLen > 24) pSize = '10.6cqw';
          else if (cLen > 18) pSize = '12cqw';
          else if (cLen > 13) pSize = '13.2cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || 'var(--fx-card-ink)';
          const isProb = activePunch.type === 'problem' || activePunch.type === 'warning';
          const rot = isProb ? -2.5 : 2;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, rot);
        }

        const ca = T.cta;
        const ctaSlot = slot('cta');
        const showCta = Boolean(!endOn && !activePunch && !showHook && !activeMf && ca && ca.text && ((ctaSlot) || (!T.slots && time >= ca.s && time <= ca.e)));
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.4;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        if (SL?.renderSubtitle) {
          SL.renderSubtitle(oSub, T, time, {
            captionMode,
            activePunch,
            hidden: endOn,
            subTop: oSub.dataset.subTop || '72.5cqh',
            subRight: '15cqw'
          });
        }
      };
    })();
  </script>
</body>
</html>
