<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: var(--fx-accent);
      --accent-soft: var(--fx-accent);
      --active-word: var(--fx-accent);
      --brand: var(--fx-card);
      --f-punch: var(--fx-font-display);
      --f-sub: var(--fx-font-body);
      --f-ui: var(--fx-font-ui);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: var(--fx-card-ink);
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--fx-accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 22cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      line-height: 0.96;
      color: var(--fx-card-ink);
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, var(--fx-size-display-sm));
      letter-spacing: 0.01em;
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1cqw 2cqw rgba(0, 0, 0, 0.65);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 1.8cqw;
      font-size: var(--hook-l2-size, var(--fx-size-display));
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1cqw 3.2cqw 0.35cqw;
      border-radius: var(--fx-radius);
      transform: rotate(-1.5deg);
      box-shadow: 0 1.1cqw 2.4cqw rgba(0, 0, 0, 0.42);
    }
    .x-phase {
      position: absolute;
      left: 4.5cqw;
      top: 13cqh;
      max-width: 62cqw;
      background: var(--fx-card);
      color: var(--fx-card-ink);
      border-left: 1.2cqw solid var(--phase-c, var(--fx-phase-problem));
      border-radius: var(--fx-radius, 1.6cqw);
      padding: 1.4cqw 2.6cqw;
      box-shadow: var(--fx-shadow);
      backdrop-filter: blur(8px);
      z-index: 6;
      transform-origin: 0% 50%;
    }
    .x-phase .lead {
      display: block;
      font-family: var(--fx-font-ui);
      font-size: var(--fx-size-label);
      font-weight: 700;
      color: var(--phase-c, var(--fx-phase-problem));
      letter-spacing: 0.02em;
      text-transform: var(--fx-text-case, uppercase);
    }
    .x-phase .line {
      display: block;
      margin-top: 0.6cqw;
      font-family: var(--fx-font-body);
      font-size: var(--fx-size-body);
      font-weight: 600;
      line-height: 1.25;
      color: var(--fx-card-ink);
    }
    .x-phase .dots {
      display: flex;
      gap: 0.8cqw;
      margin-top: 0.8cqw;
    }
    .x-phase .dots b {
      width: 1cqw;
      height: 1cqw;
      border-radius: 50%;
      background: var(--fx-card-muted);
    }
    .x-phase .dots b.on {
      background: var(--phase-c, var(--fx-phase-problem));
      transform: scale(1.3);
    }
    .x-callout {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: 50% 100%;
    }
    .x-callout .lb {
      font-family: var(--fx-font-body);
      font-weight: 800;
      font-size: var(--fx-size-body);
      color: var(--fx-card-ink);
      background: var(--fx-card);
      padding: 1.2cqw 3.2cqw;
      border-radius: var(--fx-radius);
      box-shadow: 0 1.2cqw 3cqw rgba(0, 0, 0, 0.4);
      white-space: nowrap;
      text-align: center;
    }
    .x-callout .lb small {
      display: block;
      margin-top: 0.2cqw;
      font-family: var(--fx-font-ui);
      font-weight: 600;
      font-size: var(--fx-size-meta);
      color: var(--fx-card-muted);
      text-align: center;
    }
    .x-callout .ln {
      width: 0.6cqw;
      height: 13cqh;
      background: var(--fx-accent);
      box-shadow: 0 0 1cqw rgba(0, 0, 0, 0.5);
    }
    .x-callout .dot {
      width: 3cqw;
      height: 3cqw;
      border-radius: 50%;
      background: var(--fx-card-ink);
      border: 0.8cqw solid var(--fx-accent);
      box-shadow: 0 0.4cqw 1.2cqw rgba(0, 0, 0, 0.45);
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 43cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      font-size: var(--punch-size, var(--fx-size-display));
      line-height: 0.94;
      transform-origin: 50% 50%;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.5);
    }
    .cta {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 52cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.2cqw;
    }
    .cta .arrow {
      font-family: var(--fx-font-display);
      font-size: 9cqw;
      color: var(--fx-accent);
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--fx-font-body);
      font-weight: 900;
      font-size: var(--fx-size-body);
      line-height: 1.22;
      text-align: center;
      max-width: 100%;
      white-space: normal;
      text-transform: var(--fx-text-case);
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1.3cqw 3.4cqw;
      border-radius: var(--fx-radius);
      box-shadow: 0 1cqw 0 var(--fx-stroke);
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="flash" id="oFlash"></div>
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="x-phase" id="oPhase" hidden>
      <span class="lead" id="oPhaseLead"></span>
      <span class="line" id="oPhaseLine" hidden></span>
      <i class="dots" id="oPhaseDots" hidden><b></b><b></b><b></b><b></b></i>
      <span id="oChapLabel" style="display:none"></span>
      <span id="oChapNum" style="display:none"></span>
    </div>
    <div class="x-callout" id="oCallout" hidden>
      <div class="lb"><span id="oCalloutText"></span><small id="oCalloutSub" hidden></small></div>
      <div class="ln" id="oCalloutLine"></div>
      <div class="dot"></div>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow"></div>
      <div class="pill" id="oCtaPill"></div>
    </div>
    <div class="sub" id="oSub" hidden></div>
    <div class="layer" id="oPatch" hidden></div>
    <div class="layer" id="oBrand" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script src="./shared-layers.js"></script>
  <script>
    (function () {
      const SL = window.FinishingSharedLayers || null;
      let T = null;
      let labels = { lang: 'id' };

      const oFlash = document.getElementById('oFlash');
      const oProg = document.getElementById('oProg');
      const oHook = document.getElementById('oHook');
      const oHookL1 = document.getElementById('oHookL1');
      const oHookL2 = document.getElementById('oHookL2');
      const oPhase = document.getElementById('oPhase');
      const oPhaseLead = document.getElementById('oPhaseLead');
      const oPhaseLine = document.getElementById('oPhaseLine');
      const oPhaseDots = document.getElementById('oPhaseDots');
      const oCallout = document.getElementById('oCallout');
      const oCalloutText = document.getElementById('oCalloutText');
      const oCalloutSub = document.getElementById('oCalloutSub');
      const oCalloutLine = document.getElementById('oCalloutLine');
      const oPunch = document.getElementById('oPunch');
      const oCta = document.getElementById('oCta');
      const oCtaPill = document.getElementById('oCtaPill');
      const oCtaArrow = document.getElementById('oCtaArrow');
      const oSub = document.getElementById('oSub');
      const oPatch = document.getElementById('oPatch');
      const oBrand = document.getElementById('oBrand');
      const dynamicFonts = document.getElementById('dynamic-fonts');
      const sharedLayersCss = document.getElementById('shared-layers-css');

      if (SL && sharedLayersCss) {
        sharedLayersCss.textContent = SL.SHARED_LAYERS_CSS;
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function applyPop(el, time, s, e, inDur = 0.22, outDur = 0.16, rotDeg = 0, baseTransform = '') {
        const dt = time - s;
        const rem = e - time;
        if (dt < 0 || rem < 0) {
          el.style.opacity = '0';
          el.style.transform = `${baseTransform}scale(0.85) rotate(${rotDeg}deg)`;
          return;
        }
        if (dt < inDur) {
          const k = Math.min(1, Math.max(0, dt / inDur));
          const sc = 0.85 + 0.15 * easeOutBack(k);
          el.style.opacity = String(k);
          el.style.transform = `${baseTransform}scale(${sc.toFixed(4)}) rotate(${(rotDeg * k).toFixed(2)}deg)`;
        } else if (rem < outDur) {
          const k = Math.min(1, Math.max(0, rem / outDur));
          el.style.opacity = String(k);
          el.style.transform = `${baseTransform}scale(${(0.9 + 0.1 * k).toFixed(4)}) rotate(${(rotDeg * k).toFixed(2)}deg)`;
        } else {
          el.style.opacity = '1';
          el.style.transform = `${baseTransform}scale(1) rotate(${rotDeg}deg)`;
        }
      }

      window.loadTimeline = function (timeline) {
        T = timeline;
        const cfg = T.config || {};
        labels = SL ? SL.getLocalizedLabels(cfg.targetLanguage || T.brand?.targetLanguage || 'id-ID') : { lang: 'id' };

        if (SL?.applySkinTokens) {
          SL.applySkinTokens(document, T.skin);
        } else if (T.skin?.tokens) {
          for (const [k, v] of Object.entries(T.skin.tokens)) {
            document.documentElement.style.setProperty(k, v);
          }
        }

        const customAccent = cfg.accentColor || cfg.accent || (T.brand && (T.brand.accentColor || T.brand.accent));
        if (customAccent) {
          document.documentElement.style.setProperty('--fx-accent', customAccent);
          document.documentElement.style.setProperty('--accent', customAccent);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }
        if (T.brand?.color) {
          document.documentElement.style.setProperty('--brand', T.brand.color);
        }

        if (SL?.buildDynamicFontFaces && cfg.fontBaseUrl) {
          dynamicFonts.textContent = SL.buildDynamicFontFaces(cfg.fontBaseUrl);
        }

        const pos = cfg.position || 'bottom';
        let subTop = '72.5cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        oSub.dataset.subTop = subTop;
        if (SL?.configureSubtitleLayer) {
          SL.configureSubtitleLayer(oSub, cfg, { subTop, subRight: '15cqw' });
        } else {
          document.documentElement.style.setProperty('--sub-top', subTop);
        }

        const hc = T.hookCard;
        if (hc && hc.l1) {
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.096) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.112) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.52 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null };
        const endOn = Boolean(brandState.endCard);

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(!endOn && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        // Slot resolver (Aturan Satu Fokus)
        const slot = (layer) => (T.slots || []).find((x) => x.layer === layer && time >= x.s && time < x.e);

        // Babak Natural (.x-phase)
        const chapSlot = slot('chapter');
        const activeChap = chapSlot ? chapSlot.ref : ((!endOn && !showHook && (!T.slots || T.slots.length === 0))
          ? (Array.isArray(T.chapters) ? T.chapters.find((ch) => time >= ch.s && time < ch.e) : null)
          : null);

        oPhase.hidden = !activeChap;
        if (activeChap) {
          const cTok = activeChap.colorToken || `--fx-phase-${activeChap.phaseKey || 'problem'}`;
          oPhase.style.setProperty('--phase-c', `var(${cTok})`);
          const leadTxt = activeChap.lead || activeChap.label || '';
          if (oPhaseLead.textContent !== leadTxt) {
            oPhaseLead.textContent = leadTxt;
          }
          const oChapLabel = document.getElementById('oChapLabel');
          const oChapNum = document.getElementById('oChapNum');
          if (oChapLabel) oChapLabel.textContent = leadTxt;
          if (oChapNum) oChapNum.textContent = String(activeChap.n || 1);
          if (activeChap.line) {
            if (oPhaseLine.textContent !== activeChap.line) oPhaseLine.textContent = activeChap.line;
            oPhaseLine.hidden = false;
          } else {
            oPhaseLine.textContent = '';
            oPhaseLine.hidden = true;
          }
          applyPop(oPhase, time, activeChap.s, activeChap.e, 0.2, 0.14, 0);
        }

        // VO-grounded Material/Problem Callout with leader line
        const coSlot = slot('callout');
        const activeCallout = coSlot ? coSlot.ref : ((!endOn && !showHook && (!T.slots || T.slots.length === 0))
          ? (Array.isArray(T.callouts) ? T.callouts.find((co) => time >= co.s && time < co.e) : null)
          : null);

        oCallout.hidden = !activeCallout;
        if (activeCallout) {
          oCallout.style.left = `${Number(activeCallout.x || 50)}cqw`;
          oCallout.style.top = `${Number(activeCallout.y || 27)}cqh`;
          oCalloutLine.style.height = `${Number(activeCallout.line || 13)}cqh`;
          if (oCalloutText.textContent !== activeCallout.text) oCalloutText.textContent = activeCallout.text;
          if (activeCallout.sub) {
            if (oCalloutSub.textContent !== activeCallout.sub) oCalloutSub.textContent = activeCallout.sub;
            oCalloutSub.hidden = false;
          } else {
            oCalloutSub.hidden = true;
          }
          applyPop(oCallout, time, activeCallout.s, activeCallout.e, 0.22, 0.14, 0, 'translateX(-50%) ');
        }

        // Keyword Punch
        const punchSlot = slot('punch');
        const activePunch = punchSlot ? punchSlot.ref : (!endOn
          ? (Array.isArray(T.punches) ? T.punches.find((p) => time >= p.s && time < p.e) : null)
          : null);

        oPunch.hidden = !activePunch;
        if (activePunch) {
          const punchWord = activePunch.displayText || activePunch.word || activePunch.phrase || '';
          if (oPunch.textContent !== punchWord) oPunch.textContent = punchWord;
          const punchDur = Math.max(0.4, Number(activePunch.e - activePunch.s) || 1.2);
          const pScale = Number(activePunch.scale || 1.0);
          const pSize = Number(activePunch.fontSizeCqw || (T.config?.width ? 14 : 14));
          oPunch.style.setProperty('--punch-size', `${pSize}cqw`);

          if (activePunch.type === 'problem') {
            const rot = Math.sin((time - activePunch.s) * 48) * 2.8;
            applyPop(oPunch, time, activePunch.s, activePunch.e, 0.16, 0.16, rot);
          } else {
            applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.16, -2);
          }
        }

        // Call-to-action
        const ctaSlot = slot('cta');
        const showCta = Boolean(ctaSlot ? ctaSlot.ref : (!endOn && !activePunch && T.cta && T.cta.text && time >= T.cta.s && time < T.cta.e));
        oCta.hidden = !showCta;
        if (showCta && T.cta) {
          applyPop(oCta, time, T.cta.s, T.cta.e, 0.24, 0.18, 0);
        }

        // Subtitle rendering via SharedLayers
        if (SL?.renderSubtitle) {
          SL.renderSubtitle(oSub, T, time, {
            activePunch,
            captionMode,
            hidden: endOn
          });
        }
      };
    })();
  </script>
</body>
</html>
