<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style>
    :root {
      --accent: #ffcc3d;
      --active-word: #fff066;
      --f-punch: "Anton", Impact, sans-serif;
      --f-sub: "Montserrat", "Arial Black", sans-serif;
      --f-ui: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 6cqw;
      top: 20cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      line-height: 0.96;
      color: #ffffff;
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, 9.2cqw);
      letter-spacing: 0.01em;
      -webkit-text-stroke: 0.55cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.1cqw 2.2cqw rgba(0, 0, 0, 0.65);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 1.8cqw;
      font-size: var(--hook-l2-size, 11.4cqw);
      letter-spacing: 0.01em;
      background: var(--accent);
      color: #111111;
      padding: 1.1cqw 3.2cqw 0.3cqw;
      border-radius: 1cqw;
      transform: rotate(-2deg);
      box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.45);
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 5cqw;
      top: 45cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      font-size: var(--punch-size, 16cqw);
      line-height: 0.94;
      transform-origin: 50% 50%;
      -webkit-text-stroke: 0.65cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.5);
    }
    .sub {
      position: absolute;
      left: 6cqw;
      right: 6cqw;
      top: var(--sub-top, 69cqh);
      transform: translateY(-50%);
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: nowrap;
      gap: 1.9cqw;
      text-align: center;
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: var(--sub-size, 6.6cqw);
      line-height: 1.15;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      -webkit-text-stroke: 0.55cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 0.6cqw 1.5cqw rgba(0, 0, 0, 0.68);
    }
    .sub span {
      display: inline-block;
      margin: 0;
    }
    .sub span.on {
      color: var(--active-word);
      transform: scale(1.06);
    }
    .sub.pill-mode span {
      background: #ffffff;
      color: #0d0e11;
      -webkit-text-stroke: 0;
      text-shadow: none;
      padding: 0.8cqw 2.1cqw;
      border-radius: 1.4cqw;
      margin: 0 0.7cqw;
      font-size: 0.85em;
      box-shadow: 0 0.8cqw 2cqw rgba(0, 0, 0, 0.45);
    }
    .sub.pill-mode span.on {
      background: var(--active-word);
      color: #0d0e11;
      transform: scale(1.05);
    }
    .sub.minimal-mode {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 5cqw;
      text-transform: none;
      -webkit-text-stroke: 0;
      text-shadow: none;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      border-radius: 1.8cqw;
      padding: 1.6cqw 3cqw;
      left: 8cqw;
      right: 8cqw;
      box-shadow: 0 1cqw 2.4cqw rgba(0, 0, 0, 0.35);
    }
    .sub.minimal-mode span.on {
      color: #0f172a;
      background: var(--active-word);
      padding: 0.2cqw 0.8cqw;
      border-radius: 0.8cqw;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="sub" id="oSub" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oHook = $('oHook');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oPunch = $('oPunch');
      const oSub = $('oSub');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');

      const PUNCH_COLORS = {
        benefit: '#9df27a',
        result: '#ffcc3d',
        warning: '#ff6b6b',
        hook: '#ffffff'
      };

      let T = null;

      function backOut(x) {
        const c = 1.9;
        const clamped = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(clamped - 1, 3) + c * Math.pow(clamped - 1, 2);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg) {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [] };
        const cfg = T.config || {};
        const w = Number(cfg.width) || 720;
        const h = Number(cfg.height) || 1280;
        oPhone.style.width = `${w}px`;
        oPhone.style.height = `${h}px`;

        if (cfg.accentColor) document.documentElement.style.setProperty('--accent', cfg.accentColor);
        if (cfg.activeWordColor) document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);

        if (cfg.fontBaseUrl) {
          const base = String(cfg.fontBaseUrl).replace(/\/+$/, '');
          dynamicFonts.textContent = `
            @font-face { font-family: "Anton"; src: url("${base}/Anton-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
            @font-face { font-family: "Inter"; src: url("${base}/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
          `;
        }

        const pos = cfg.position || 'bottom';
        let subTop = '69cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        document.documentElement.style.setProperty('--sub-top', subTop);

        oSub.className = 'sub';
        if (cfg.style === 'floating_black_on_white') oSub.classList.add('pill-mode');
        else if (cfg.style === 'minimal_white') oSub.classList.add('minimal-mode');

        const hc = T.hookCard;
        if (hc && hc.l1) {
          const l1Cqw = ((hc.l1Ratio || 0.092) * 100).toFixed(2) + 'cqw';
          const l2Cqw = ((hc.l2Ratio || 0.114) * 100).toFixed(2) + 'cqw';
          oHook.style.setProperty('--hook-l1-size', l1Cqw);
          oHook.style.setProperty('--hook-l2-size', l2Cqw);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        // 1. Progress Bar
        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;

        // 2. Hook Card (0 .. hookDuration)
        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        // 3. Keyword Punch
        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = punches.find((p) => time >= p.s && time < p.e);
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '16cqw';
          if (cLen > 24) pSize = '11cqw';
          else if (cLen > 18) pSize = '12.8cqw';
          else if (cLen > 13) pSize = '14.2cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || PUNCH_COLORS.result;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 2);
        }

        // 4. Subtitle Layer (respects captionMode: 'hybrid' | 'keyword_only' | 'full')
        if (captionMode === 'keyword_only' || (captionMode === 'hybrid' && activePunch)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const chunks = Array.isArray(T.chunks) ? T.chunks : [];
        const words = Array.isArray(T.words) ? T.words : [];
        const punchWordSet = new Set(T.punchWordIndices || []);

        const activeChunk = chunks.find((ch) => time >= ch.s - 0.03 && time <= ch.e + 0.08);
        if (!activeChunk || !Array.isArray(activeChunk.indices)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const visibleIndices = captionMode === 'hybrid'
          ? activeChunk.indices.filter((idx) => !punchWordSet.has(idx))
          : activeChunk.indices;

        if (visibleIndices.length === 0) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const joinedLen = visibleIndices.map((idx) => words[idx]?.w || '').join(' ').length;
        let subCqw = '6.6cqw';
        if (joinedLen > 22) subCqw = '4.9cqw';
        else if (joinedLen > 17) subCqw = '5.6cqw';
        else if (joinedLen > 14) subCqw = '6.1cqw';
        oSub.style.setProperty('--sub-size', subCqw);

        oSub.hidden = false;
        oSub.innerHTML = visibleIndices.map((idx) => {
          const item = words[idx];
          if (!item) return '';
          const isOn = time >= item.s && time <= item.e + 0.04;
          const span = document.createElement('span');
          span.className = isOn ? 'on' : '';
          span.textContent = String(item.w || '');
          return span.outerHTML;
        }).join(' ');
      };
    })();
  </script>
</body>
</html>
