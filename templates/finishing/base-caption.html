<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: var(--fx-accent);
      --active-word: var(--fx-accent);
      --f-punch: var(--fx-font-display);
      --f-sub: var(--fx-font-body);
      --f-ui: var(--fx-font-ui);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--fx-accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 6cqw;
      top: 20cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      line-height: 0.96;
      color: var(--fx-card-ink);
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, var(--fx-size-display-sm, 9.2cqw));
      letter-spacing: 0.01em;
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.1cqw 2.2cqw var(--fx-shadow, rgba(0, 0, 0, 0.65));
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 1.8cqw;
      font-size: var(--hook-l2-size, var(--fx-size-display, 11.4cqw));
      letter-spacing: 0.01em;
      background: var(--fx-accent);
      color: var(--fx-accent-ink);
      padding: 1.1cqw 3.2cqw 0.3cqw;
      border-radius: var(--fx-radius, 1cqw);
      transform: rotate(-2deg);
      box-shadow: 0 1.2cqw 2.4cqw var(--fx-shadow, rgba(0, 0, 0, 0.45));
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 5cqw;
      top: 45cqh;
      text-align: center;
      font-family: var(--fx-font-display);
      text-transform: var(--fx-text-case);
      font-size: var(--punch-size, var(--fx-size-display, 16cqw));
      line-height: 0.94;
      transform-origin: 50% 50%;
      -webkit-text-stroke: var(--fx-stroke-width) var(--fx-stroke);
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 var(--fx-shadow, rgba(0, 0, 0, 0.5));
    }
  </style>
  <script src="./shared-layers.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="sub" id="oSub" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oHook = $('oHook');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oPunch = $('oPunch');
      const oSub = $('oSub');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');
      const sharedCssEl = $('shared-layers-css');
      const SL = window.FinishingSharedLayers || null;
      if (sharedCssEl && SL?.SHARED_LAYERS_CSS) {
        sharedCssEl.textContent = SL.SHARED_LAYERS_CSS;
      }

      const PUNCH_COLORS = {
        benefit: 'var(--fx-phase-solution)',
        result: 'var(--fx-accent)',
        warning: 'var(--fx-phase-cause)',
        problem: 'var(--fx-phase-problem)',
        hook: 'var(--fx-card-ink)'
      };

      let T = null;

      function backOut(x) {
        const c = 1.9;
        const clamped = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(clamped - 1, 3) + c * Math.pow(clamped - 1, 2);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg) {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [] };
        const cfg = T.config || {};
        const w = Number(cfg.width) || 720;
        const h = Number(cfg.height) || 1280;
        oPhone.style.width = `${w}px`;
        oPhone.style.height = `${h}px`;

        if (SL?.applySkinTokens) {
          SL.applySkinTokens(document, T.skin);
        } else if (T.skin?.tokens) {
          for (const [k, v] of Object.entries(T.skin.tokens)) {
            document.documentElement.style.setProperty(k, v);
          }
        }

        if (cfg.accentColor) {
          document.documentElement.style.setProperty('--fx-accent', cfg.accentColor);
          document.documentElement.style.setProperty('--accent', cfg.accentColor);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }

        if (SL?.buildDynamicFontFaces && cfg.fontBaseUrl) {
          dynamicFonts.textContent = SL.buildDynamicFontFaces(cfg.fontBaseUrl);
        }

        const pos = cfg.position || 'bottom';
        let subTop = '69cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        oSub.dataset.subTop = subTop;
        if (SL?.configureSubtitleLayer) {
          SL.configureSubtitleLayer(oSub, cfg, { subTop, subRight: '6cqw' });
        } else {
          document.documentElement.style.setProperty('--sub-top', subTop);
        }

        const hc = T.hookCard;
        if (hc && hc.l1) {
          const l1Cqw = ((hc.l1Ratio || 0.092) * 100).toFixed(2) + 'cqw';
          const l2Cqw = ((hc.l2Ratio || 0.114) * 100).toFixed(2) + 'cqw';
          oHook.style.setProperty('--hook-l1-size', l1Cqw);
          oHook.style.setProperty('--hook-l2-size', l2Cqw);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        // 1. Progress Bar
        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;

        // Slot resolver (Aturan Satu Fokus)
        const slot = (layer) => (T.slots || []).find((x) => x.layer === layer && time >= x.s && time < x.e);

        // 2. Hook Card (0 .. hookDuration)
        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const hookSlot = slot('hook');
        const showHook = Boolean((hookSlot && T.hookCard && T.hookCard.l1) || (!T.slots && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd));
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        // 3. Keyword Punch
        const punches = Array.isArray(T.punches) ? T.punches : [];
        const punchSlot = slot('punch');
        const activePunch = punchSlot
          ? (punchSlot.ref || punches.find((p) => time >= p.s && time < p.e))
          : ((!T.slots || T.slots.length === 0) ? punches.find((p) => time >= p.s && time < p.e) : null);

        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '16cqw';
          if (cLen > 24) pSize = '11cqw';
          else if (cLen > 18) pSize = '12.8cqw';
          else if (cLen > 13) pSize = '14.2cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || 'var(--fx-card-ink)';
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 2);
        }

        // 4. Subtitle Layer (shared renderer — R14, R16)
        if (SL?.renderSubtitle) {
          SL.renderSubtitle(oSub, T, time, {
            captionMode,
            activePunch,
            subTop: oSub.dataset.subTop || '69cqh',
            subRight: '6cqw'
          });
        }
      };
    })();
  </script>
</body>
</html>
