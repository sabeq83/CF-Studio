<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamic-fonts"></style>
  <style id="shared-layers-css"></style>
  <style>
    :root {
      --accent: #d9653b;
      --accent-soft: #f08a62;
      --active-word: #fff066;
      --brand: #231915;
      --f-punch: "Anton", Impact, sans-serif;
      --f-sub: "Montserrat", "Arial Black", sans-serif;
      --f-ui: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
    .phone {
      position: relative;
      width: 720px;
      height: 1280px;
      overflow: hidden;
      container-type: size;
      background: transparent;
    }
    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
    }
    .progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 0.9cqw;
      width: 0;
      background: var(--accent);
    }
    .hook {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 22cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      line-height: 0.96;
      color: #ffffff;
      transform-origin: 50% 50%;
    }
    .hook .l1 {
      display: block;
      font-size: var(--hook-l1-size, 9.6cqw);
      letter-spacing: 0.01em;
      -webkit-text-stroke: 0.52cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1cqw 2cqw rgba(0, 0, 0, 0.65);
    }
    .hook .l2 {
      display: inline-block;
      margin-top: 1.8cqw;
      font-size: var(--hook-l2-size, 11.2cqw);
      background: var(--accent);
      color: #111111;
      padding: 1cqw 3.2cqw 0.35cqw;
      border-radius: 1.2cqw;
      transform: rotate(-1.5deg);
      box-shadow: 0 1.1cqw 2.4cqw rgba(0, 0, 0, 0.4);
    }
    .x-loc {
      position: absolute;
      left: 5cqw;
      top: 13cqh;
      max-width: 76cqw;
      font-family: var(--f-sub);
      font-weight: 800;
      font-size: 3.4cqw;
      color: #111827;
      background: rgba(255, 255, 255, 0.94);
      padding: 1cqw 2.8cqw;
      border-radius: 99cqw;
      box-shadow: 0 1cqw 2.4cqw rgba(0, 0, 0, 0.35);
      border-left: 1cqw solid var(--accent);
    }
    .x-tip {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 51cqh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.2cqw;
      transform-origin: 0% 50%;
    }
    .x-tip .n {
      font-family: var(--f-punch);
      font-size: 9.8cqw;
      line-height: 1;
      color: var(--accent);
      -webkit-text-stroke: 0.48cqw #000000;
      paint-order: stroke fill;
      letter-spacing: 0.02em;
      text-shadow: 0 0.8cqw 1.6cqw rgba(0, 0, 0, 0.55);
    }
    .x-tip .n small {
      font-size: 5.8cqw;
      color: #ffffff;
    }
    .x-tip .t {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 4.8cqw;
      line-height: 1.16;
      color: #111827;
      background: rgba(255, 255, 255, 0.96);
      padding: 1.6cqw 3.2cqw;
      border-radius: 2.2cqw;
      border-left: 1.2cqw solid var(--accent);
      box-shadow: 0 1.4cqw 2.8cqw rgba(0, 0, 0, 0.38);
      max-width: 100%;
    }
    .x-recap {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 15cqh;
      background: rgba(255, 250, 243, 0.97);
      color: #1f2937;
      border-radius: 3cqw;
      padding: 3.2cqw 3.8cqw;
      box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, 0.45);
      transform-origin: 50% 0%;
    }
    .x-recap .hd {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 3.2cqw;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .x-recap .ti {
      font-family: var(--f-punch);
      font-size: 6.8cqw;
      line-height: 1.02;
      margin: 0.8cqw 0 1.8cqw;
      text-transform: uppercase;
      color: #111827;
    }
    .x-recap ul {
      margin: 0;
      padding: 0;
    }
    .x-recap li {
      list-style: none;
      display: flex;
      gap: 1.8cqw;
      align-items: flex-start;
      font-family: var(--f-sub);
      font-weight: 800;
      font-size: 3.9cqw;
      line-height: 1.22;
      margin: 1.2cqw 0;
    }
    .x-recap li b {
      flex: none;
      width: 5cqw;
      height: 5cqw;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 3cqw;
    }
    .x-recap .sv {
      margin-top: 2cqw;
      padding-top: 1.6cqw;
      border-top: 0.3cqw dashed rgba(17, 24, 39, 0.18);
      font-family: var(--f-sub);
      font-weight: 800;
      font-size: 3.5cqw;
      color: #334155;
    }
    .punch {
      position: absolute;
      left: 5cqw;
      right: 15cqw;
      top: 41cqh;
      text-align: center;
      font-family: var(--f-punch);
      text-transform: uppercase;
      font-size: var(--punch-size, 15.5cqw);
      line-height: 0.94;
      transform-origin: 50% 50%;
      -webkit-text-stroke: 0.65cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 1.3cqw 0 rgba(0, 0, 0, 0.5);
    }
    .cta {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: 56cqh;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.4cqw;
    }
    .cta .arrow {
      font-family: var(--f-punch);
      font-size: 10cqw;
      color: var(--accent);
      -webkit-text-stroke: 0.45cqw #000000;
      paint-order: stroke fill;
      line-height: 1;
    }
    .cta .pill {
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: 4.5cqw;
      text-transform: uppercase;
      background: var(--accent);
      color: #111111;
      padding: 1.4cqw 3.8cqw;
      border-radius: 99cqw;
      box-shadow: 0 1.2cqw 0 #000000;
    }
    .sub {
      position: absolute;
      left: 6cqw;
      right: 15cqw;
      top: var(--sub-top, 71cqh);
      transform: translateY(-50%);
      display: flex;
      justify-content: center;
      align-items: baseline;
      flex-wrap: nowrap;
      gap: 1.9cqw;
      text-align: center;
      font-family: var(--f-sub);
      font-weight: 900;
      font-size: var(--sub-size, 6.4cqw);
      line-height: 1.15;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      -webkit-text-stroke: 0.55cqw #000000;
      paint-order: stroke fill;
      text-shadow: 0 0.6cqw 1.5cqw rgba(0, 0, 0, 0.68);
    }
    .sub span { display: inline-block; margin: 0; }
    .sub span.on { color: var(--active-word); transform: scale(1.06); }
    .sub.pill-mode span {
      background: #ffffff;
      color: #0d0e11;
      -webkit-text-stroke: 0;
      text-shadow: none;
      padding: 0.8cqw 2cqw;
      border-radius: 1.4cqw;
      font-size: 0.85em;
      box-shadow: 0 0.8cqw 2cqw rgba(0, 0, 0, 0.45);
    }
    .sub.pill-mode span.on {
      background: var(--active-word);
      color: #0d0e11;
      transform: scale(1.05);
    }
    .sub.minimal-mode {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 4.8cqw;
      text-transform: none;
      -webkit-text-stroke: 0;
      text-shadow: none;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      border-radius: 1.8cqw;
      padding: 1.5cqw 2.8cqw;
      box-shadow: 0 1cqw 2.4cqw rgba(0, 0, 0, 0.35);
    }
    .sub.minimal-mode span.on {
      color: #0f172a;
      background: var(--active-word);
      padding: 0.2cqw 0.8cqw;
      border-radius: 0.8cqw;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="flash" id="oFlash"></div>
    <div class="x-loc" id="oLoc" hidden></div>
    <div class="hook" id="oHook" hidden>
      <span class="l1" id="oHookL1"></span>
      <span class="l2" id="oHookL2"></span>
    </div>
    <div class="x-tip" id="oTip" hidden>
      <div class="n" id="oTipNum"></div>
      <div class="t" id="oTipText"></div>
    </div>
    <div class="x-recap" id="oRecap" hidden>
      <div class="hd" id="oRecapHead"></div>
      <div class="ti" id="oRecapTitle"></div>
      <ul id="oRecapList"></ul>
      <div class="sv" id="oRecapSave"></div>
    </div>
    <div class="punch" id="oPunch" hidden></div>
    <div class="cta" id="oCta" hidden>
      <div class="arrow" id="oCtaArrow"></div>
      <div class="pill" id="oCtaPill"></div>
    </div>
    <div class="sub" id="oSub" hidden></div>
    <div class="layer" id="oPatch" hidden></div>
    <div class="layer" id="oBrand" hidden></div>
    <div class="progress" id="oProg"></div>
  </div>

  <script src="./shared-layers.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const oPhone = $('phone');
      const oFlash = $('oFlash');
      const oLoc = $('oLoc');
      const oHook = $('oHook');
      const oHookL1 = $('oHookL1');
      const oHookL2 = $('oHookL2');
      const oTip = $('oTip');
      const oTipNum = $('oTipNum');
      const oTipText = $('oTipText');
      const oRecap = $('oRecap');
      const oRecapHead = $('oRecapHead');
      const oRecapTitle = $('oRecapTitle');
      const oRecapList = $('oRecapList');
      const oRecapSave = $('oRecapSave');
      const oPunch = $('oPunch');
      const oCta = $('oCta');
      const oCtaArrow = $('oCtaArrow');
      const oCtaPill = $('oCtaPill');
      const oSub = $('oSub');
      const oPatch = $('oPatch');
      const oBrand = $('oBrand');
      const oProg = $('oProg');
      const dynamicFonts = $('dynamic-fonts');
      const sharedCssEl = $('shared-layers-css');
      const SL = window.FinishingSharedLayers || null;

      if (SL && sharedCssEl) {
        sharedCssEl.textContent = SL.SHARED_LAYERS_CSS || '';
      }

      const PUNCH_COLORS = {
        benefit: '#9df27a',
        result: '#ffcc3d',
        number: '#ffcc3d',
        warning: '#ff6b6b',
        problem: '#ff6b6b',
        hook: '#ffffff'
      };

      let T = null;
      let labels = SL ? SL.getLocalizedLabels('id-ID') : { tipLabel: 'TIP', recap: 'RINGKASAN', savePromptTitle: '' };

      function backOut(x) {
        const c = 1.9;
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 + (c + 1) * Math.pow(cl - 1, 3) + c * Math.pow(cl - 1, 2);
      }

      function easeOut(x) {
        const cl = Math.min(Math.max(x, 0), 1);
        return 1 - Math.pow(1 - cl, 3);
      }

      function applyPop(el, t, s, e, inDur, outDur, rotDeg) {
        const lt = t - s;
        const rt = e - t;
        let sc = backOut(lt / inDur);
        let op = Math.min(1, Math.max(0, lt / 0.06));
        if (rt < outDur) {
          const k = Math.max(rt, 0) / outDur;
          op = Math.min(op, k);
          sc *= 0.9 + 0.1 * k;
        }
        el.style.opacity = String(op);
        el.style.transform = `scale(${sc.toFixed(4)}) rotate(${rotDeg || 0}deg)`;
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"]/g, (c) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;'
        }[c]));
      }

      window.loadTimeline = function (timeline) {
        T = timeline || { config: {}, words: [], chunks: [], punches: [], tips: [] };
        const cfg = T.config || {};
        oPhone.style.width = `${Number(cfg.width) || 720}px`;
        oPhone.style.height = `${Number(cfg.height) || 1280}px`;

        if (cfg.accentColor) {
          document.documentElement.style.setProperty('--accent', cfg.accentColor);
          document.documentElement.style.setProperty('--accent-soft', cfg.accentColor);
        }
        if (cfg.activeWordColor) {
          document.documentElement.style.setProperty('--active-word', cfg.activeWordColor);
        }
        if (T.brand?.color) {
          document.documentElement.style.setProperty('--brand', T.brand.color);
        }

        if (SL) {
          labels = SL.getLocalizedLabels(cfg.targetLanguage || T.brand?.targetLanguage || 'id-ID');
        }

        if (cfg.fontBaseUrl) {
          const base = String(cfg.fontBaseUrl).replace(/\/+$/, '');
          dynamicFonts.textContent = `
            @font-face { font-family: "Anton"; src: url("${base}/Anton-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; font-style: normal; }
            @font-face { font-family: "Montserrat"; src: url("${base}/Montserrat-Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
            @font-face { font-family: "Inter"; src: url("${base}/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
          `;
        }

        const pos = cfg.position || 'bottom';
        let subTop = '71cqh';
        if (pos === 'top') subTop = '16cqh';
        else if (pos === 'center') subTop = '50cqh';
        document.documentElement.style.setProperty('--sub-top', subTop);

        oSub.className = 'sub';
        if (cfg.style === 'floating_black_on_white') oSub.classList.add('pill-mode');
        else if (cfg.style === 'minimal_white') oSub.classList.add('minimal-mode');

        const hc = T.hookCard;
        if (hc && hc.l1) {
          oHook.style.setProperty('--hook-l1-size', `${((hc.l1Ratio || 0.096) * 100).toFixed(2)}cqw`);
          oHook.style.setProperty('--hook-l2-size', `${((hc.l2Ratio || 0.112) * 100).toFixed(2)}cqw`);
          oHookL1.textContent = hc.l1;
          if (hc.l2) {
            oHookL2.textContent = hc.l2;
            oHookL2.hidden = false;
          } else {
            oHookL2.textContent = '';
            oHookL2.hidden = true;
          }
        } else {
          oHook.hidden = true;
        }

        const locText = String(T.brand?.location || '').trim();
        oLoc.textContent = locText;
        oLoc.hidden = !locText;

        const tips = Array.isArray(T.tips) ? T.tips : [];
        if (tips.length > 0) {
          oRecapHead.textContent = labels.recap || 'RECAP';
          oRecapTitle.textContent = T.hookCard?.text || T.brand?.tagline || labels.recap || '';
          oRecapTitle.hidden = !oRecapTitle.textContent;
          oRecapList.innerHTML = tips.map((tp, idx) => `<li data-i="${idx}"><b>✓</b><span>${escapeHtml(tp.text)}</span></li>`).join('');
          const svText = T.savePrompt?.titleText || labels.savePromptTitle || '';
          oRecapSave.textContent = svText;
          oRecapSave.hidden = !svText;
        } else {
          oRecap.hidden = true;
        }

        const ca = T.cta;
        if (ca && ca.text) {
          oCtaPill.textContent = ca.text;
          oCtaArrow.textContent = ca.arrowDir || '▼';
        } else {
          oCta.hidden = true;
        }
        return true;
      };

      window.renderAt = function (t) {
        if (!T) return;
        const dur = Math.max(0.1, Number(T.config?.duration) || 1);
        const captionMode = T.config?.captionMode || 'full';
        const time = Math.min(Math.max(0, Number(t) || 0), dur);

        oProg.style.width = `${((time / dur) * 100).toFixed(3)}%`;
        let flashOp = 0;
        for (const cutT of (T.clipCuts || [])) {
          const d = time - Number(cutT);
          if (d >= 0 && d < 0.12) {
            flashOp = 0.52 * (1 - d / 0.12);
            break;
          }
        }
        oFlash.style.opacity = flashOp.toFixed(4);

        // Shared brand layers (x-wm, x-lower, x-patch, x-notice, x-end)
        const brandState = SL
          ? SL.renderSharedLayersDom({ oBrandRoot: oBrand, oPatchRoot: oPatch, timeline: T, time })
          : { endCard: null };
        const endOn = Boolean(brandState.endCard);

        // Optional location badge from brand profile on clip 0 (inside safe zone >= 13cqh)
        const locText = String(T.brand?.location || '').trim();
        const firstCut = Array.isArray(T.clipCuts) && T.clipCuts.length > 0 ? Number(T.clipCuts[0]) : Math.min(dur, 4.0);
        const showLoc = Boolean(!endOn && locText && time >= 0.1 && time < Math.max(1.5, firstCut - 0.1));
        oLoc.hidden = !showLoc;
        if (showLoc) {
          const slideX = (1 - easeOut((time - 0.1) / 0.3)) * -55;
          oLoc.style.transform = `translateX(${slideX.toFixed(2)}cqw)`;
          oLoc.style.opacity = String(Math.min(1, Math.max(0, (firstCut - time) / 0.2)));
        }

        const hookEnd = Number(T.config?.hookDuration) || 1.75;
        const showHook = Boolean(!endOn && T.hookCard && T.hookCard.l1 && time >= 0 && time < hookEnd);
        oHook.hidden = !showHook;
        if (showHook) {
          applyPop(oHook, time, 0, hookEnd, 0.24, 0.16, 0);
        }

        const punches = Array.isArray(T.punches) ? T.punches : [];
        const activePunch = !endOn ? punches.find((p) => time >= p.s && time < p.e) : null;
        oPunch.hidden = !activePunch;
        if (activePunch) {
          const txt = String(activePunch.displayText || activePunch.phrase || '').toUpperCase();
          const cLen = txt.length;
          let pSize = '15.5cqw';
          if (cLen > 24) pSize = '11cqw';
          else if (cLen > 18) pSize = '12.6cqw';
          else if (cLen > 13) pSize = '14cqw';
          oPunch.style.setProperty('--punch-size', pSize);
          oPunch.textContent = txt;
          oPunch.style.color = PUNCH_COLORS[activePunch.type] || PUNCH_COLORS.result;
          applyPop(oPunch, time, activePunch.s, activePunch.e, 0.18, 0.14, 1.2);
        }

        // End recap box (last ~2.8s before end card, or end of video if no endCard)
        const tips = Array.isArray(T.tips) ? T.tips : [];
        const sharedCfg = T.config?.sharedBrand || {};
        const endCardDur = sharedCfg.enabled && (T.brand?.name || T.brand?.logoUrl || T.endCard)
          ? Math.min(2.0, Math.max(1.5, Number(T.endCard?.duration ?? sharedCfg.endCardDuration ?? 1.75)))
          : 0;
        const recapEnd = dur - endCardDur;
        const recapStart = Math.max(hookEnd + 0.5, recapEnd - Math.min(3.2, Math.max(1.8, dur * 0.22)));
        const showRecap = Boolean(!endOn && !activePunch && tips.length > 0 && recapEnd > recapStart + 0.6 && time >= recapStart && time < recapEnd);
        oRecap.hidden = !showRecap;
        if (showRecap) {
          applyPop(oRecap, time, recapStart, recapEnd, 0.26, 0.16, 0);
          const listEls = oRecapList.querySelectorAll('li');
          listEls.forEach((li, idx) => {
            const lt = time - recapStart - 0.25 - idx * 0.35;
            li.style.opacity = lt > 0 ? '1' : '0.2';
            const tx = lt > 0 ? (1 - easeOut(lt / 0.24)) * -6 : -6;
            li.style.transform = `translateX(${tx.toFixed(2)}cqw)`;
          });
          const svLag = time - recapStart - 0.25 - tips.length * 0.35;
          oRecapSave.style.opacity = svLag > 0 ? '1' : '0';
        }

        // Slide-in numbered tip in lower-left safe zone (hidden during Hook, Punch, Recap, EndCard)
        const activeTip = (!endOn && !showRecap && !activePunch && !showHook)
          ? tips.find((tp) => time >= tp.s && time < tp.e)
          : null;
        oTip.hidden = !activeTip;
        if (activeTip) {
          const numHtml = `${escapeHtml(labels.tipLabel || 'TIP')} ${activeTip.n}<small>/${activeTip.total}</small>`;
          if (oTipNum.innerHTML !== numHtml) oTipNum.innerHTML = numHtml;
          if (oTipText.textContent !== activeTip.text) oTipText.textContent = activeTip.text;
          const kIn = easeOut((time - activeTip.s) / 0.28);
          const kOut = Math.min(1, Math.max(0, (activeTip.e - time) / 0.16));
          oTip.style.transform = `translateX(${((1 - kIn) * -72).toFixed(2)}cqw)`;
          oTip.style.opacity = String(kOut);
        }

        const ca = T.cta;
        const showCta = Boolean(!endOn && !showRecap && !activePunch && ca && ca.text && time >= ca.s && time <= ca.e);
        oCta.hidden = !showCta;
        if (showCta) {
          applyPop(oCta, time, ca.s, Math.max(ca.e, ca.s + 1), 0.24, 0.15, 0);
          const bounceY = Math.abs(Math.sin((time - ca.s) * 6)) * 2.4;
          oCtaArrow.style.transform = `translateY(${bounceY.toFixed(2)}cqw)`;
        }

        if (endOn || captionMode === 'keyword_only' || (captionMode === 'hybrid' && activePunch)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const chunks = Array.isArray(T.chunks) ? T.chunks : [];
        const words = Array.isArray(T.words) ? T.words : [];
        const punchWordSet = new Set(T.punchWordIndices || []);
        const activeChunk = chunks.find((ch) => time >= ch.s - 0.03 && time <= ch.e + 0.08);
        if (!activeChunk || !Array.isArray(activeChunk.indices)) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const visibleIndices = captionMode === 'hybrid'
          ? activeChunk.indices.filter((idx) => !punchWordSet.has(idx))
          : activeChunk.indices;

        if (visibleIndices.length === 0) {
          oSub.hidden = true;
          oSub.innerHTML = '';
          return;
        }

        const joinedLen = visibleIndices.map((idx) => words[idx]?.w || '').join(' ').length;
        let subCqw = '6.4cqw';
        if (joinedLen > 22) subCqw = '4.8cqw';
        else if (joinedLen > 17) subCqw = '5.5cqw';
        else if (joinedLen > 14) subCqw = '6.0cqw';
        oSub.style.setProperty('--sub-size', subCqw);

        oSub.hidden = false;
        oSub.innerHTML = visibleIndices.map((idx) => {
          const item = words[idx];
          if (!item) return '';
          const isOn = time >= item.s && time <= item.e + 0.04;
          const span = document.createElement('span');
          span.className = isOn ? 'on' : '';
          span.textContent = String(item.w || '');
          return span.outerHTML;
        }).join(' ');
      };
    })();
  </script>
</body>
</html>
